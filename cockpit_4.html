<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hilgenroth – Firmen-Cockpit</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;}
body{font-family:'IBM Plex Sans',sans-serif;background:#111;color:#fff;display:flex;flex-direction:column;}

/* ── TOP BAR ── */
.topbar{
  height:52px;background:#0d0d0d;
  border-bottom:3px solid #C0000C;
  display:flex;align-items:stretch;
  flex-shrink:0;z-index:20;
}
.topbar-logo{
  display:flex;align-items:center;gap:11px;
  padding:0 20px;border-right:1px solid #222;flex-shrink:0;
  min-width:200px;
}
.logo-sq{
  width:30px;height:30px;background:#C0000C;
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  color:#fff;letter-spacing:.05em;flex-shrink:0;
}
.logo-name{font-size:12px;font-weight:500;color:#fff;line-height:1.3;}
.logo-name small{display:block;font-size:10px;color:#666;font-weight:400;letter-spacing:.07em;text-transform:uppercase;}

.tool-tabs{display:flex;align-items:stretch;flex:1;overflow-x:auto;scrollbar-width:none;}
.tool-tabs::-webkit-scrollbar{display:none;}

.ttab{
  display:flex;align-items:center;gap:8px;
  padding:0 16px;font-size:12px;font-weight:500;
  color:#777;cursor:pointer;border:none;background:none;
  border-bottom:3px solid transparent;margin-bottom:-3px;
  white-space:nowrap;font-family:'IBM Plex Sans',sans-serif;
  transition:color .12s,border-color .12s,background .12s;
  flex-shrink:0;
}
.ttab:hover{color:#ccc;background:rgba(255,255,255,.04);}
.ttab.active{color:#fff;border-bottom-color:#C0000C;background:rgba(192,0,12,.10);}
.ttab svg{width:15px;height:15px;flex-shrink:0;opacity:.7;}
.ttab.active svg{opacity:1;}

/* Labor-Tab mit Pfeil */
.ttab.has-sub{position:relative;}
.ttab.has-sub::after{content:'▾';font-size:10px;margin-left:2px;color:#555;}
.ttab.has-sub.active::after{color:#C0000C;}

.topbar-right{
  display:flex;align-items:center;padding:0 16px;
  border-left:1px solid #222;flex-shrink:0;
}
.clock{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#555;letter-spacing:.06em;}

/* ── SUB-TAB BAR (Labor) ── */
.sub-bar{
  height:0;overflow:hidden;
  background:#181818;border-bottom:1px solid #222;
  display:flex;align-items:stretch;
  flex-shrink:0;transition:height .15s;
}
.sub-bar.visible{height:34px;}
.stab{
  display:flex;align-items:center;gap:7px;
  padding:0 14px;font-size:11px;font-weight:500;
  color:#666;cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  white-space:nowrap;font-family:'IBM Plex Sans',sans-serif;
  transition:color .12s,border-color .12s;
}
.stab:hover{color:#bbb;}
.stab.active{color:#fff;border-bottom-color:#C0000C;}
.stab svg{width:13px;height:13px;flex-shrink:0;}

/* ── COMPANY BAR ── */
.company-bar{
  height:34px;background:#141414;border-bottom:1px solid #1e1e1e;
  display:flex;align-items:center;padding:0 20px;gap:6px;flex-shrink:0;
}
.company-bar-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#3a3a3a;margin-right:8px;}
.cbtn{
  height:22px;padding:0 12px;border-radius:3px;
  font-size:11px;font-weight:500;font-family:'IBM Plex Sans',sans-serif;
  cursor:pointer;border:1px solid #252525;background:#1a1a1a;
  color:#666;transition:all .12s;white-space:nowrap;
}
.cbtn:hover{border-color:#3a3a3a;color:#bbb;}
.cbtn.active{background:#C0000C;border-color:#C0000C;color:#fff;font-weight:600;}

/* ── IFRAME BEREICH ── */
.iframe-area{flex:1;position:relative;overflow:hidden;background:#1a1a1a;}

iframe.tool-frame{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;background:#f5f5f5;display:none;
}
iframe.tool-frame.active{display:block;}

/* Placeholder */
.placeholder-screen{
  position:absolute;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:#111;
}
.placeholder-screen.active{display:flex;}
.ph-icon{opacity:.15;}
.ph-icon svg{width:56px;height:56px;}
.ph-title{font-size:15px;font-weight:500;color:#555;}
.ph-desc{font-size:12px;color:#3a3a3a;max-width:320px;text-align:center;line-height:1.6;}
.ph-badge{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:#181818;border:1px solid #252525;color:#444;
  padding:4px 12px;border-radius:3px;
}

/* Loader */
.frame-loader{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  flex-direction:column;gap:14px;
  background:#111;z-index:5;
}
.frame-loader.visible{display:flex;}
.spinner{
  width:28px;height:28px;border:2px solid #222;
  border-top-color:#C0000C;border-radius:50%;
  animation:spin .8s linear infinite;
}
.loader-label{font-size:12px;color:#444;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error */
.frame-error{
  position:absolute;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:12px;background:#111;z-index:6;
}
.frame-error.visible{display:flex;}
.error-box{
  background:#1a0000;border:1px solid #3a0000;border-radius:4px;
  padding:20px 28px;text-align:center;max-width:420px;
}
.error-box p{font-size:13px;color:#aa4444;line-height:1.6;margin-bottom:12px;}
.error-box code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#666;background:#111;padding:4px 8px;border-radius:3px;display:block;margin-top:8px;}
.retry-btn{
  font-size:12px;font-family:'IBM Plex Sans',sans-serif;
  background:#C0000C;color:#fff;border:none;
  padding:6px 16px;border-radius:3px;cursor:pointer;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <div class="logo-sq">RH</div>
    <div class="logo-name">
      Rudolf Hilgenroth
      <small id="div-label">Straßen-, Tief- u. Kanalbau</small>
    </div>
  </div>
  <div class="tool-tabs" id="tool-tabs"></div>
  <div class="topbar-right">
    <span class="clock" id="clock">--:--</span>
  </div>
</div>

<!-- Sub-Tab-Leiste für Labor -->
<div class="sub-bar" id="sub-bar">
  <button class="stab active" data-sub="labor-asphalt" onclick="switchSub('labor-asphalt',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5"/><polyline points="9 11 12 14 22 9"/></svg>
    Analyse Asphaltmischgut
  </button>
  <button class="stab" data-sub="labor-bericht" onclick="switchSub('labor-bericht',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Laborbericht
  </button>
  <button class="stab" data-sub="labor-beton" onclick="switchSub('labor-beton',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    Betonprüfung
  </button>
</div>

<div class="company-bar">
  <span class="company-bar-label">Bereich</span>
  <button class="cbtn active" onclick="switchCompany('stb',this)">Straßen-, Tief- u. Kanalbau</button>
  <button class="cbtn" onclick="switchCompany('sbtb',this)">Straßenbaustoffe &amp; Transportbeton</button>
</div>

<div class="iframe-area" id="iframe-area"></div>

<script>
// SVG Icons
const ICONS = {
  urlaub: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
  miet:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`,
  lief:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="9"/><line x1="12" y1="15" x2="12" y2="22"/><line x1="2" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="22" y2="12"/></svg>`,
  dispo:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`,
  labor:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>`,
  zahlen: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
};

const TOOLS = {
  stb: [
    { id:'stb-urlaub', label:'Urlaubszentrale',   icon:'urlaub', file:'index__9_.html' },
    { id:'stb-miet',   label:'Mietrechner',        icon:'miet',   file:'Mietrechner.html' },
    { id:'stb-lief',   label:'Lieferanten-Finder', icon:'lief',   file:'Liefreanten_Locater.html' },
  ],
  sbtb: [
    { id:'sbtb-dispo', label:'Dispo-Zentrale',     icon:'dispo',  file:'Dispo.html' },
    { id:'sbtb-lief',  label:'Lieferanten-Finder', icon:'lief',   file:'Liefreanten_Locater.html' },
    { id:'sbtb-labor', label:'Labor',              icon:'labor',  sub:true },
    { id:'sbtb-aspz',  label:'Asphalt – Zahlen',   icon:'zahlen', file:null, placeholder:true },
    { id:'sbtb-betz',  label:'Beton – Zahlen',     icon:'zahlen', file:null, placeholder:true },
  ],
};

const SUB_TOOLS = {
  'labor-asphalt': { label:'Analyse Asphaltmischgut', file:'Analyse_Asphaltmischgut.html' },
  'labor-bericht': { label:'Laborbericht',             file:'Labor.html' },
  'labor-beton':   { label:'Betonprüfung',             file:'Betonpruefungen.html' },
};

const loadedFrames = new Set();
let currentCompany = 'stb';
let laborOpen = false;
let currentSub = 'labor-asphalt';

function buildFrames() {
  const area = document.getElementById('iframe-area');
  area.innerHTML = '';

  // Alle normalen Tools
  for (const tools of Object.values(TOOLS)) {
    for (const t of tools) {
      if (t.sub) continue; // Labor-Gruppe — Sub-Tools stattdessen
      if (t.placeholder) {
        const ph = document.createElement('div');
        ph.className = 'placeholder-screen';
        ph.id = 'ph-' + t.id;
        ph.innerHTML = `
          <div class="ph-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" width="56" height="56"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
          <div class="ph-title">${t.label}</div>
          <div class="ph-desc">Dieser Bereich wird derzeit entwickelt.</div>
          <span class="ph-badge">In Planung</span>`;
        area.appendChild(ph);
      } else {
        appendFrame(area, t.id, t.label, t.file);
      }
    }
  }

  // Labor Sub-Tools
  for (const [subId, sub] of Object.entries(SUB_TOOLS)) {
    appendFrame(area, subId, sub.label, sub.file);
  }
}

function appendFrame(area, id, label, file) {
  const loader = document.createElement('div');
  loader.className = 'frame-loader';
  loader.id = 'loader-' + id;
  loader.innerHTML = `<div class="spinner"></div><div class="loader-label">${label} wird geladen …</div>`;
  area.appendChild(loader);

  const err = document.createElement('div');
  err.className = 'frame-error';
  err.id = 'error-' + id;
  err.innerHTML = `<div class="error-box">
    <p>Die Datei konnte nicht geladen werden.<br>Stelle sicher, dass alle Dateien im selben Ordner liegen und öffne Chrome mit:<br></p>
    <code>--allow-file-access-from-files</code>
    <br><br><button class="retry-btn" onclick="retryFrame('${id}','${file}')">Erneut versuchen</button>
  </div>`;
  area.appendChild(err);

  const fr = document.createElement('iframe');
  fr.className = 'tool-frame';
  fr.id = 'frame-' + id;
  fr.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation-by-user-activation');
  fr.addEventListener('load', () => {
    document.getElementById('loader-' + id)?.classList.remove('visible');
    // Check if loaded empty (file access blocked)
    try {
      const doc = fr.contentDocument || fr.contentWindow?.document;
      if (!doc || doc.title === '' && doc.body && doc.body.innerHTML.length < 20) {
        document.getElementById('loader-' + id)?.classList.remove('visible');
        document.getElementById('error-' + id)?.classList.add('visible');
      }
    } catch(e) {}
  });
  fr.addEventListener('error', () => {
    document.getElementById('loader-' + id)?.classList.remove('visible');
    document.getElementById('error-' + id)?.classList.add('visible');
  });
  area.appendChild(fr);
}

function retryFrame(id, file) {
  document.getElementById('error-' + id)?.classList.remove('visible');
  loadAndShow(id, file);
}

function loadAndShow(id, file) {
  const fr = document.getElementById('frame-' + id);
  const loader = document.getElementById('loader-' + id);
  if (!fr) return;
  if (!loadedFrames.has(id)) {
    loadedFrames.add(id);
    if (loader) loader.classList.add('visible');
    fr.src = file;
  }
  fr.classList.add('active');
}

function hideAll() {
  document.querySelectorAll('.tool-frame, .placeholder-screen, .frame-error').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.frame-loader').forEach(el => el.classList.remove('visible'));
  document.querySelectorAll('.ttab').forEach(b => b.classList.remove('active'));
}

function activateTool(toolId) {
  hideAll();
  const btn = document.querySelector(`.ttab[data-tool-id="${toolId}"]`);
  if (btn) btn.classList.add('active');

  const allTools = [...TOOLS.stb, ...TOOLS.sbtb];
  const t = allTools.find(x => x.id === toolId);
  if (!t) return;

  // Labor-Gruppe → Sub-Bar zeigen
  const subBar = document.getElementById('sub-bar');
  if (t.sub) {
    laborOpen = true;
    subBar.classList.add('visible');
    activateSub(currentSub);
    return;
  } else {
    laborOpen = false;
    subBar.classList.remove('visible');
  }

  if (t.placeholder) {
    document.getElementById('ph-' + toolId)?.classList.add('active');
    return;
  }

  loadAndShow(toolId, t.file);
}

function activateSub(subId) {
  currentSub = subId;
  document.querySelectorAll('.tool-frame, .placeholder-screen, .frame-error').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.frame-loader').forEach(el => el.classList.remove('visible'));
  document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.stab[data-sub="${subId}"]`);
  if (btn) btn.classList.add('active');
  const sub = SUB_TOOLS[subId];
  if (sub) loadAndShow(subId, sub.file);
}

function switchSub(subId, btn) {
  activateSub(subId);
}

function renderTabs(company) {
  const tabsEl = document.getElementById('tool-tabs');
  tabsEl.innerHTML = '';
  TOOLS[company].forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'ttab' + (t.sub ? ' has-sub' : '');
    btn.dataset.toolId = t.id;
    btn.innerHTML = `${ICONS[t.icon] || ''}${t.label}`;
    btn.addEventListener('click', () => activateTool(t.id));
    tabsEl.appendChild(btn);
  });
}

function switchCompany(company, btn) {
  currentCompany = company;
  document.querySelectorAll('.cbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const labels = { stb:'Straßen-, Tief- u. Kanalbau', sbtb:'Straßenbaustoffe & Transportbeton' };
  document.getElementById('div-label').textContent = labels[company];
  document.getElementById('sub-bar').classList.remove('visible');
  laborOpen = false;
  renderTabs(company);
  hideAll();
  const first = TOOLS[company][0];
  if (first) activateTool(first.id);
}

buildFrames();
renderTabs('stb');
activateTool(TOOLS.stb[0].id);

function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}
tick();
setInterval(tick, 10000);
</script>
</body>
</html>
