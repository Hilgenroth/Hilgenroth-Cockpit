<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einkauf – Materialliste | Hilgenroth</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;}
body{font-family:'IBM Plex Sans',sans-serif;background:#F7F8FA;color:#1B1D22;font-size:14px;display:flex;flex-direction:column;}
:root{
  --red:#C8102E;--red-d:#9E0C24;--red-l:#FCE9EC;
  --ink:#1B1D22;--slate:#4A4F58;--muted:#8A909B;
  --line:#E6E8EC;--bg:#F7F8FA;--white:#fff;
  --green:#16a34a;--green-l:#dcfce7;
  --amber:#d97706;--amber-l:#fef3c7;
  --blue:#1d4ed8;--blue-l:#dbeafe;
  --purple:#7c3aed;--purple-l:#ede9fe;
}

/* Header */
.hdr{height:52px;background:var(--white);border-bottom:2px solid var(--red);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.logo{width:30px;height:30px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;}
.hdr-t{font-size:13px;font-weight:600;}
.hdr-s{font-size:10px;color:var(--muted);}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--amber);}
.sdot.on{background:var(--green);}
.slbl{font-size:11px;color:var(--muted);}

/* Nav */
.nav{display:flex;background:var(--white);border-bottom:1px solid var(--line);padding:0 20px;flex-shrink:0;}
.ntab{height:40px;padding:0 14px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;transition:color .14s,border-color .14s;}
.ntab:hover{color:var(--ink);}
.ntab.on{color:var(--red);border-bottom-color:var(--red);font-weight:600;}
.ntab svg{width:14px;height:14px;stroke-width:1.8;}

/* Layout */
.wrap{display:flex;flex:1;overflow:hidden;}
.side{width:185px;flex-shrink:0;background:var(--white);border-right:1px solid var(--line);padding:10px 0;overflow-y:auto;}
.side-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 12px 6px;}
.scat{width:100%;text-align:left;padding:7px 12px;background:none;border:none;border-left:3px solid transparent;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--slate);display:flex;align-items:center;gap:6px;transition:.12s;}
.scat:hover{background:var(--bg);color:var(--ink);}
.scat.on{background:var(--red-l);color:var(--red);border-left-color:var(--red);}
.scat svg{width:13px;height:13px;stroke-width:1.8;flex-shrink:0;}

/* Main */
.main{flex:1;overflow-y:auto;padding:18px 22px;}

/* Buttons */
.btn{height:30px;padding:0 13px;border-radius:6px;font-size:12px;font-weight:500;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:.14s;white-space:nowrap;}
.btn-p{background:var(--red);color:#fff;}.btn-p:hover{background:var(--red-d);}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--slate);}.btn-g:hover{border-color:var(--muted);color:var(--ink);}
.btn-sm{height:26px;padding:0 9px;font-size:11px;border-radius:4px;}

/* Search */
.sbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.swrap{position:relative;flex:1;max-width:380px;}
.swrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);stroke-width:2;pointer-events:none;}
.sinp{width:100%;height:34px;padding:0 10px 0 30px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--white);}
.sinp:focus{outline:none;border-color:var(--red);}

/* Compare */
.cmpbox{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px;}
.cmphd{padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.cmpcards{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px;}
.ccard{border:1px solid var(--line);border-radius:7px;padding:10px 14px;min-width:160px;cursor:pointer;transition:.14s;position:relative;}
.ccard:hover{border-color:var(--red);}
.ccard.best{border-color:var(--green);background:var(--green-l);}
.ccard .cl{font-size:12px;font-weight:600;margin-bottom:3px;}
.ccard .cp{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--green);}
.ccard .cn{font-size:11px;color:var(--muted);margin-top:3px;}
.ccard .cb{position:absolute;top:5px;right:7px;font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase;}
.ccard .ca{font-size:12px;color:var(--amber);font-weight:500;}

/* Table */
.twrap{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{background:var(--bg);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg);}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;}
.p-val{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--green);}
.p-afr{color:var(--amber);font-size:11px;font-weight:500;}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:4px;}
.ts{background:var(--green-l);color:var(--green);}
.ta{background:var(--amber-l);color:var(--amber);}
.tb{background:var(--blue-l);color:var(--blue);}
.tsc{background:var(--purple-l);color:var(--purple);}
.to{background:var(--line);color:var(--slate);}
.tp{background:var(--red-l);color:var(--red-d);}
.ra{display:flex;gap:3px;opacity:0;transition:.12s;}
tr:hover .ra{opacity:1;}
.ib{width:25px;height:25px;border-radius:4px;border:1px solid var(--line);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ib svg{width:12px;height:12px;stroke-width:1.8;}
.ib.e:hover{border-color:var(--red);color:var(--red);}
.ib.d:hover{border-color:#ef4444;color:#ef4444;}

/* Cards */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.lcard{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;transition:.14s;}
.lcard:hover{border-color:var(--red);}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.pcard{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;transition:.14s;}
.pcard:hover{border-color:var(--red);}

/* Back */
.back{display:flex;align-items:center;gap:7px;margin-bottom:14px;cursor:pointer;font-size:13px;font-weight:500;color:var(--slate);}
.back:hover{color:var(--red);}
.back svg{width:15px;height:15px;stroke-width:2;}

/* Phead */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.pht{font-size:15px;font-weight:600;}

/* Modal */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:200;}
.bd.on{display:flex;}
.md{background:var(--white);border-radius:10px;padding:22px;width:440px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:0 8px 28px rgba(0,0,0,.14);}
.mdt{font-size:14px;font-weight:600;margin-bottom:16px;}
.fr{margin-bottom:11px;}
.fr label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);display:block;margin-bottom:4px;}
.fi,.fs{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--white);}
.fi:focus,.fs:focus{outline:none;border-color:var(--red);}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ma{display:flex;gap:7px;justify-content:flex-end;margin-top:16px;}
.std-box{background:var(--bg);border-radius:6px;padding:7px 10px;font-size:11px;color:var(--muted);margin-top:2px;}

.empty{padding:36px;text-align:center;color:var(--muted);}
.empty svg{width:34px;height:34px;stroke:var(--muted);margin-bottom:10px;opacity:.3;display:block;margin:0 auto 10px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">RH</div>
  <div><div class="hdr-t">Einkauf – Materialliste</div><div class="hdr-s">Rudolf Hilgenroth GmbH & Co. KG · Hellefeld</div></div>

    <button class="scat" onclick="goKat('Asphalt',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17h18M3 17l3-11h12l3 11"/></svg>Asphalt</button>
    <button class="scat" onclick="goKat('Beton',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="8" width="18" height="12" rx="1.5"/><path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/></svg>Beton</button>
    <button class="scat" onclick="goKat('Schmierstoffe',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Schmierstoffe</button>
    <button class="scat" onclick="goKat('Sonstige',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Sonstige</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- Modals -->
<div class="bd" id="bd-mat">

      <div class="fr" style="margin:0"><label>Menge (Tonnen)</label><input class="fi" id="pp-menge" placeholder="z.B. 500" type="number" min="0" step="0.1" oninput="ppCalc()"></div>

    <div class="std-box" id="pp-gesamt-box" style="display:none">

    <div class="fr"><label>Einheit</label><select class="fs" id="pp-ein"><option>€/t</option><option>€/m³</option><option>€/kg</option><option>€/l</option><option>Auf Anfrage</option></select></div>

  </div>
</div>

// ── Sync ──
function sync(on){
  document.getElementById('sdot').className='sdot'+(on?' on':'');
  document.getElementById('slbl').textContent=on?'synchronisiert':'offline – Daten lokal';
}

// ── Helpers ──
function ktag(k){return {'Gesteinskörnung & Sand':'ts','Asphalt':'ta','Beton':'tb','Schmierstoffe':'tsc','Sonstige':'to'}[k]||'to';}
function pnum(p){return p?parseFloat(p.replace(',','.'))||0:null;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── Tab ──
function goTab(t){
  curTab=t; curLief=null; curProj=null;
  ['preise','lief','proj'].forEach(id=>{
    document.getElementById('nt-'+id).className='ntab'+(t===id?' on':'');
  });
  document.getElementById('side').style.display=t==='preise'?'':'none';
  draw();
}

// ── Kategorie ──
function goKat(k,btn){
  curKat=k;
  document.querySelectorAll('.scat').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  draw();
}

// ── Draw router ──
function draw(){
  if(curTab==='preise') drawPreise();
  else if(curTab==='lief') drawLief();
  else drawProj();
}

// ── PREISE ──
function drawPreise(){
  const main=document.getElementById('main');
  let rows=Object.entries(mats).filter(([k,v])=>v&&v.material);
  if(curKat!=='alle') rows=rows.filter(([k,v])=>v.kategorie===curKat);

  const isSearch=sq.length>=2;
  let groups={};
  rows.forEach(([k,v])=>{
    const m=v.material.toLowerCase();
    if(!groups[m]) groups[m]={name:v.material,kat:v.kategorie,items:[]};
    groups[m].items.push({k,v});
  });
  let fg=Object.entries(groups);
  if(isSearch) fg=fg.filter(([m])=>m.includes(sq));
  const frows=isSearch?[]:rows.filter(([k,v])=>!sq||((v.lieferant+v.material+v.notiz+v.kategorie).toLowerCase().includes(sq)));

  let html=`<div class="ph">
    <div class="pht">${curKat==='alle'?'Alle Materialien':esc(curKat)}</div>
    <div style="display:flex;gap:7px;align-items:center">
      ${isSearch?`<span style="font-size:12px;color:var(--red);font-weight:500">${fg.length} Treffer</span>`:`<span style="font-size:12px;color:var(--muted)">${frows.length} Einträge</span>`}
      <button class="btn btn-p" onclick="openMat()">+ Material</button>
    </div>
  </div>
  <div class="sbar">
    <div class="swrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="sinp" id="sq-inp" value="${esc(sq)}" placeholder="Material suchen – Lieferanten werden verglichen …">
    </div>
  </div>`;

  if(isSearch){
    if(!fg.length){html+=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>Kein Material gefunden für „${esc(sq)}"</p></div>`;}
    fg.forEach(([mk,grp])=>{
      const nums=grp.items.filter(i=>i.v.preis&&pnum(i.v.preis)>0).map(i=>pnum(i.v.preis));
      const best=nums.length?Math.min(...nums):null;
      html+=`<div class="cmpbox"><div class="cmphd"><span style="font-size:13px;font-weight:600">${esc(grp.name)}</span><span class="badge ${ktag(grp.kat)}" style="margin-left:6px">${esc(grp.kat)}</span><span style="margin-left:auto;font-size:11px;color:var(--muted)">${grp.items.length} Lieferant${grp.items.length!==1?'en':''}</span></div><div class="cmpcards">`;
      grp.items.forEach(({k,v})=>{
        const n=pnum(v.preis); const isBest=best&&n===best;
        html+=`<div class="ccard${isBest?' best':''}" onclick="goLief('${esc(v.lieferant)}')">
          ${isBest?'<span class="cb">Günstigster</span>':''}
          <div class="cl">${esc(v.lieferant)}</div>
          ${v.preis?`<div class="cp">${esc(v.preis)} ${v.einheit!=='Auf Anfrage'?esc(v.einheit):''}</div>`:'<div class="ca">Auf Anfrage</div>'}
          ${v.notiz?`<div class="cn">${esc(v.notiz)}</div>`:''}
        </div>`;
      });
      html+=`</div></div>`;
    });
  } else {
    html+=`<div class="twrap"><table class="tbl"><thead><tr><th>Lieferant</th><th>Material / Sorte</th><th>Kategorie</th><th>EK-Preis</th><th>Einheit</th><th>Notiz</th><th></th></tr></thead><tbody>`;
    if(!frows.length) html+=`<tr><td colspan="7"><div class="empty"><p>Keine Einträge</p></div></td></tr>`;
    frows.forEach(([k,v])=>{
      html+=`<tr>
        <td style="font-weight:500;cursor:pointer;color:var(--red)" onclick="goLief('${esc(v.lieferant)}')">${esc(v.lieferant)}</td>
        <td style="color:var(--slate)">${esc(v.material)}</td>
        <td><span class="badge ${ktag(v.kategorie)}">${esc(v.kategorie)}</span></td>
        <td class="${v.preis?'p-val':'p-afr'}">${v.preis?esc(v.preis)+(v.einheit!=='Auf Anfrage'?' '+esc(v.einheit):''):'Auf Anfrage'}</td>
        <td class="mono" style="color:var(--muted)">${v.einheit!=='Auf Anfrage'?esc(v.einheit):''}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(v.notiz||'')}</td>
        <td><div class="ra">
          <button class="ib e" onclick="openMat('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
          <button class="ib d" onclick="delMat('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
        </div></td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  }
  main.innerHTML=html;
  // Search-Event NACH dem Rendern anhängen — kein oninput im HTML
  const inp=document.getElementById('sq-inp');
  if(inp){
    inp.addEventListener('input',function(){sq=this.value.trim().toLowerCase();drawPreise();});
    // Cursor ans Ende setzen
    const len=inp.value.length; inp.setSelectionRange(len,len);
    inp.focus();
  }
}

// ── PROJEKTE ──
function drawProj(){
  const main=document.getElementById('main');
  if(curProj&&projs[curProj]){
    const pj=projs[curProj]; const prices=pj.preise||{};
    let html=`<div class="back" onclick="curProj=null;drawProj()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg>Zurück</div>
    <div class="ph"><div><div class="pht">${esc(pj.name)}</div>${pj.baustelle?`<div style="font-size:12px;color:var(--muted)">${esc(pj.baustelle)}</div>`:''}</div>
    <div style="display:flex;gap:7px"><button class="btn btn-g" onclick="openProj('${curProj}')">Bearbeiten</button><button class="btn btn-p" onclick="openPP()">+ Projektpreis</button></div></div>
    <div class="twrap"><table class="tbl"><thead><tr><th>Lieferant</th><th>Sorte / Material</th><th>Kat.</th><th>Menge (t)</th><th>Projektpreis</th><th>Standardpreis</th><th>Ersparnis</th><th>Notiz</th><th></th></tr></thead><tbody>`;
    const pa=Object.entries(prices);
    if(!pa.length) html+=`<tr><td colspan="8"><div class="empty"><p>Noch keine Projektpreise. Klicke „+ Projektpreis".</p></div></td></tr>`;
    pa.forEach(([pk,pv])=>{
      const std=Object.values(mats).find(m=>m&&m.lieferant===pv.lieferant&&m.material.toLowerCase()===(pv.material||'').toLowerCase());
      const sp=std?pnum(std.preis):null; const pp=pnum(pv.preis);
      const diff=sp&&pp?((sp-pp)/sp*100).toFixed(1):null;
      html+=`<tr>
        <td style="font-weight:500">${esc(pv.lieferant)}</td><td>${esc(pv.material)}</td>
        <td><span class="badge ${ktag(pv.kategorie)}">${esc(pv.kategorie)}</span></td>
        <td class="mono" style="font-weight:600">${pv.menge?pv.menge+' t':'-'}</td>
        <td class="${pv.preis?'p-val':'p-afr'}">${pv.preis?esc(pv.preis)+' '+esc(pv.einheit||''):'Auf Anfrage'}</td>
        <td class="mono" style="color:var(--muted)">${std&&std.preis?esc(std.preis)+' '+esc(std.einheit||''):'-'}</td>
        <td>${diff?`<span style="color:var(--green);font-weight:600;font-size:12px">${parseFloat(diff)>0?'–'+diff+'%':'±0%'}</span>`:'-'}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(pv.notiz||'')}</td>
        <td><div class="ra">
          <button class="ib e" onclick="openPP('${pk}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
          <button class="ib d" onclick="delPP('${pk}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
        </div></td></tr>`;
    });
    html+=`</tbody></table></div>`;
    main.innerHTML=html; return;
  }
  const pa=Object.entries(projs).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
  let html=`<div class="ph"><div class="pht">Projektpreise</div><button class="btn btn-p" onclick="openProj()">+ Projekt anlegen</button></div><div class="pgrid">`;
  pa.forEach(([k,v])=>{
    if(!v||!v.name) return;
    const cnt=Object.keys(v.preise||{}).length;
    html+=`<div class="pcard" onclick="curProj='${k}';drawProj()">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px">
        <div style="font-size:13px;font-weight:600">${esc(v.name)}</div>
        <span class="badge tp">${cnt} Preis${cnt!==1?'e':''}</span>
      </div>
      ${v.baustelle?`<div style="font-size:11px;color:var(--muted)">${esc(v.baustelle)}</div>`:''}
      ${v.notiz?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(v.notiz)}</div>`:''}
      <div style="display:flex;gap:4px;margin-top:10px;justify-content:flex-end">
        <button class="btn btn-g btn-sm" onclick="event.stopPropagation();openProj('${k}')">Bearb.</button>
        <button class="btn btn-g btn-sm" style="color:#ef4444" onclick="event.stopPropagation();delProj('${k}')">Löschen</button>
      </div>
    </div>`;
  });
  if(!pa.length) html+=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><p>Noch keine Projekte angelegt.</p></div>`;
  html+=`</div>`;
  main.innerHTML=html;
}

  const cur=sel.value;
  const names=[...new Set(Object.values(liefs).filter(l=>l&&l.name).map(l=>l.name))].sort();
  sel.innerHTML=names.map(n=>`<option${n===cur?' selected':''}>${esc(n)}</option>`).join('');
}

// ── Material CRUD ──
function openMat(key,forLief){

}
function saveMat(){
  const l=document.getElementById('mat-lief').value, m=document.getElementById('mat-mat').value.trim();

function delMat(k){if(!confirm('Löschen?'))return;MR.child(k).remove();delete mats[k];draw();}

// ── Projekt CRUD ──
function openProj(key){
  projKey=key||null;
  document.getElementById('proj-title').textContent=key?'Projekt bearbeiten':'Neues Projekt';
  if(key&&projs[key]){
    const v=projs[key];
    document.getElementById('pj-name').value=v.name||'';
    document.getElementById('pj-bst').value=v.baustelle||'';
    document.getElementById('pj-not').value=v.notiz||'';
  } else {
    ['pj-name','pj-bst','pj-not'].forEach(id=>document.getElementById(id).value='');
  }
  // Lieferanten-Select befüllen
  const lsel=document.getElementById('pj-lief');
  const names=[...new Set(Object.values(liefs).filter(l=>l&&l.name).map(l=>l.name))].sort();
  lsel.innerHTML='<option value="">— kein Preis anlegen —</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');
  // Preis-Felder zurücksetzen
  ['pj-preis','pj-menge','pj-pnot'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pj-mat').innerHTML='<option value="">— erst Lieferant wählen —</option>';
  document.getElementById('pj-std').textContent='–';
  document.getElementById('pj-gesamt-box').style.display='none';
  // Preissektion nur bei neuem Projekt anzeigen
  const divider=document.querySelector('#bd-proj .divider');
  const preisSection=divider?divider.nextElementSibling:null;
  // Immer anzeigen (auch bei Bearbeitung kann man Preis hinzufügen)
  openM('bd-proj');
}
function pjUpdateMat(){
  const lief=document.getElementById('pj-lief').value;
  const sel=document.getElementById('pj-mat');
  if(!lief){sel.innerHTML='<option value="">— erst Lieferant wählen —</option>';document.getElementById('pj-std').textContent='–';return;}
  const items=Object.values(mats).filter(m=>m&&m.lieferant===lief).sort((a,b)=>{
    const ap=a.kategorie==='Gesteinskörnung & Sand'?0:1,bp=b.kategorie==='Gesteinskörnung & Sand'?0:1;
    return ap!==bp?ap-bp:a.material.localeCompare(b.material);
  });
  const grps={};
  items.forEach(m=>{if(!grps[m.kategorie])grps[m.kategorie]=[];grps[m.kategorie].push(m);});
  let html='<option value="">— Material wählen —</option>';
  Object.entries(grps).forEach(([kat,ms])=>{
    html+=`<optgroup label="${esc(kat)}">`;
    ms.forEach(m=>{html+=`<option value="${esc(m.material)}" data-kat="${esc(m.kategorie)}" data-preis="${esc(m.preis||'')}" data-ein="${esc(m.einheit||'€/t')}">${esc(m.material)}${m.preis?' ('+m.preis+' '+m.einheit+')':' (Auf Anfrage)'}</option>`;});
    html+='</optgroup>';
  });
  if(!items.length) html='<option value="">— Keine Materialien für diesen Lieferanten —</option>';
  sel.innerHTML=html;
  pjUpdateStd();
}
function pjUpdateStd(){
  const sel=document.getElementById('pj-mat');const opt=sel.selectedOptions[0];
  if(!opt||!opt.value){document.getElementById('pj-std').textContent='–';pjCalc();return;}
  document.getElementById('pj-kat').value=opt.dataset.kat||'Gesteinskörnung & Sand';
  document.getElementById('pj-ein').value=opt.dataset.ein||'€/t';
  document.getElementById('pj-std').textContent=opt.dataset.preis?(opt.dataset.preis+' '+opt.dataset.ein):'Auf Anfrage';
  pjCalc();
}
function pjCalc(){
  const preis=parseFloat((document.getElementById('pj-preis').value||'').replace(',','.'));
  const menge=parseFloat(document.getElementById('pj-menge').value||'');
  const sel=document.getElementById('pj-mat');const opt=sel.selectedOptions[0];
  const std=opt&&opt.dataset.preis?parseFloat((opt.dataset.preis||'').replace(',','.')):null;
  const gb=document.getElementById('pj-gesamt-box');
  if(preis>0&&menge>0){
    gb.style.display='';
    document.getElementById('pj-gesamt').textContent=(preis*menge).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
    if(std&&std>0){
      const ers=((std-preis)*menge).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
      const pct=((std-preis)/std*100).toFixed(1);
      document.getElementById('pj-ersparnis').textContent=(std>preis?'':'Mehrkosten ')+ers+' € ('+Math.abs(pct)+'%)';
      document.getElementById('pj-ersparnis').style.color=std>preis?'var(--green)':'var(--amber)';
    } else {document.getElementById('pj-ersparnis').textContent='';}
  } else {gb.style.display='none';}
}
function saveProj(){
  const name=document.getElementById('pj-name').value.trim();
  if(!name){alert('Projektname ist Pflichtfeld.');return;}
  const e={name,baustelle:document.getElementById('pj-bst').value.trim(),notiz:document.getElementById('pj-not').value.trim()};
  const lief=document.getElementById('pj-lief').value;
  const mat=document.getElementById('pj-mat').value.trim();
  let projId;
  if(projKey){
    PR.child(projKey).update(e);
    projs[projKey]={...projs[projKey],...e};
    projId=projKey;
  } else {
    const k=PR.push().key;
    PR.child(k).set({...e,preise:{}});
    projs[k]={...e,preise:{}};
    projId=k;
  }
  // Optionalen ersten Projektpreis speichern
  if(lief&&mat){
    const pe={lieferant:lief,material:mat,
      kategorie:document.getElementById('pj-kat').value,
      preis:document.getElementById('pj-preis').value.trim(),
      menge:document.getElementById('pj-menge').value.trim(),
      einheit:document.getElementById('pj-ein').value,
      notiz:document.getElementById('pj-pnot').value.trim()};
    const ref=PR.child(projId).child('preise');
    const pk=ref.push().key;
    ref.child(pk).set(pe);
    if(!projs[projId].preise) projs[projId].preise={};
    projs[projId].preise[pk]=pe;
  }
  closeM('bd-proj'); draw();
}
function delProj(k){if(!confirm('Projekt und alle Preise löschen?'))return;PR.child(k).remove();delete projs[k];if(curProj===k)curProj=null;draw();}

// ── Projektpreis CRUD ──
function ppUpdateMat(){
  const lief=document.getElementById('pp-lief').value;
  const sel=document.getElementById('pp-mat');
  const items=Object.values(mats).filter(m=>m&&m.lieferant===lief).sort((a,b)=>{
    const ap=a.kategorie==='Gesteinskörnung & Sand'?0:1, bp=b.kategorie==='Gesteinskörnung & Sand'?0:1;
    return ap!==bp?ap-bp:a.material.localeCompare(b.material);
  });
  const grps={};
  items.forEach(m=>{if(!grps[m.kategorie])grps[m.kategorie]=[];grps[m.kategorie].push(m);});
  let html='<option value="">— Material wählen —</option>';
  Object.entries(grps).forEach(([kat,ms])=>{
    html+=`<optgroup label="${esc(kat)}">`;
    ms.forEach(m=>{html+=`<option value="${esc(m.material)}" data-kat="${esc(m.kategorie)}" data-preis="${esc(m.preis||'')}" data-ein="${esc(m.einheit||'€/t')}">${esc(m.material)}${m.preis?' ('+m.preis+' '+m.einheit+')':' (Auf Anfrage)'}</option>`;});
    html+='</optgroup>';
  });
  if(!items.length) html='<option value="">— Keine Materialien für diesen Lieferanten —</option>';
  sel.innerHTML=html;
  ppUpdateStd();
}
function ppUpdateStd(){
  const sel=document.getElementById('pp-mat'); const opt=sel.selectedOptions[0];
  if(!opt||!opt.value){document.getElementById('pp-std').textContent='–';ppCalc();return;}
  document.getElementById('pp-kat').value=opt.dataset.kat||'Gesteinskörnung & Sand';
  document.getElementById('pp-ein').value=opt.dataset.ein||'€/t';
  document.getElementById('pp-std').textContent=opt.dataset.preis?(opt.dataset.preis+' '+opt.dataset.ein):'Auf Anfrage';
  ppCalc();
}
function ppCalc(){
  const preis=parseFloat((document.getElementById('pp-preis').value||'').replace(',','.'));
  const menge=parseFloat(document.getElementById('pp-menge').value||'');
  const sel=document.getElementById('pp-mat'); const opt=sel.selectedOptions[0];
  const std=opt&&opt.dataset.preis?parseFloat((opt.dataset.preis||'').replace(',','.')):null;
  const gb=document.getElementById('pp-gesamt-box');
  if(preis>0&&menge>0){
    gb.style.display='';
    const gesamt=(preis*menge).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
    document.getElementById('pp-gesamt').textContent=gesamt+' €';
    if(std&&std>0){
      const ers=((std-preis)*menge).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
      const pct=((std-preis)/std*100).toFixed(1);
      document.getElementById('pp-ersparnis').textContent=(std>preis?'Ersparnis ':'Mehrkosten ')+ers+' € ('+Math.abs(pct)+'%)';
      document.getElementById('pp-ersparnis').style.color=std>preis?'var(--green)':'var(--amber)';
    } else { document.getElementById('pp-ersparnis').textContent=''; }
  } else { gb.style.display='none'; }
}
function openPP(key){
  ppKey=key||null;
  document.getElementById('pp-title').textContent=key?'Projektpreis bearbeiten':'Projektpreis hinzufügen';
  fillLS('pp-lief');
  if(key&&curProj&&projs[curProj]&&projs[curProj].preise&&projs[curProj].preise[key]){
    const v=projs[curProj].preise[key];
    document.getElementById('pp-lief').value=v.lieferant||'';
    ppUpdateMat();
    document.getElementById('pp-mat').value=v.material||'';
    document.getElementById('pp-kat').value=v.kategorie||'Gesteinskörnung & Sand';
    document.getElementById('pp-preis').value=v.preis||'';
    document.getElementById('pp-menge').value=v.menge||'';
    document.getElementById('pp-ein').value=v.einheit||'€/t';
    document.getElementById('pp-not').value=v.notiz||'';
    document.getElementById('pp-std').textContent='–';
    document.getElementById('pp-gesamt-box').style.display='none';
  } else {
    ['pp-preis','pp-not'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('pp-menge').value='';
    document.getElementById('pp-kat').value='Gesteinskörnung & Sand';
    document.getElementById('pp-ein').value='€/t';
    document.getElementById('pp-std').textContent='–';
    document.getElementById('pp-gesamt-box').style.display='none';
    ppUpdateMat();
  }
  openM('bd-pp');
}
function savePP(){
  if(!curProj)return;
  const l=document.getElementById('pp-lief').value, m=document.getElementById('pp-mat').value.trim();
  if(!l||!m){alert('Lieferant und Material sind Pflichtfelder.');return;}
  const e={lieferant:l,material:m,kategorie:document.getElementById('pp-kat').value,preis:document.getElementById('pp-preis').value.trim(),menge:document.getElementById('pp-menge').value.trim(),einheit:document.getElementById('pp-ein').value,notiz:document.getElementById('pp-not').value.trim()};
  const ref=PR.child(curProj).child('preise');
  if(!projs[curProj].preise) projs[curProj].preise={};
  if(ppKey){ref.child(ppKey).update(e);projs[curProj].preise[ppKey]={...projs[curProj].preise[ppKey],...e};}
  else{const k=ref.push().key;ref.child(k).set(e);projs[curProj].preise[k]=e;}
  closeM('bd-pp'); draw();
}
function delPP(k){if(!confirm('Löschen?'))return;PR.child(curProj).child('preise').child(k).remove();delete projs[curProj].preise[k];draw();}

// ── Modal ──
function openM(id){document.getElementById(id).classList.add('on');}
function closeM(id){document.getElementById(id).classList.remove('on');}
document.querySelectorAll('.bd').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)closeM(b.id);}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.bd.on').forEach(b=>closeM(b.id));});

// ── Firebase Init ──
function initFB(){
  db.ref('.info/connected').on('value',s=>sync(!!s.val()));
  MR.once('value').then(s=>{if(!s.val()){const b={};SMAT.forEach(m=>{const k=MR.push().key;b[k]={...m};});MR.update(b);}}).catch(()=>{});
  MR.on('value',s=>{const v=s.val();if(v&&Object.keys(v).length>0){mats=v;}draw();},()=>{});
  LR.once('value').then(s=>{if(!s.val()){const b={};SLIEF.forEach(l=>{const k=LR.push().key;b[k]={...l};});LR.update(b);}}).catch(()=>{});
  LR.on('value',s=>{const v=s.val();if(v&&Object.keys(v).length>0){liefs=v;}draw();},()=>{});
  PR.on('value',s=>{projs=s.val()||{};draw();},()=>{});
}

// ── Start ──
// Seed-Daten sofort lokal laden
SMAT.forEach((m,i)=>{mats['_'+i]={...m};});
SLIEF.forEach((l,i)=>{liefs['_'+i]={...l};});
draw();
sync(false);
// Firebase im Hintergrund
initFB();
</script>
