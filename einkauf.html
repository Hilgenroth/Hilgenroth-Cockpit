<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C8102E;--red-dark:#9E0C24;--red-light:#FCE9EC;
  --ink:#1B1D22;--slate:#4A4F58;--muted:#8A909B;
  --line:#E6E8EC;--bg:#F7F8FA;--white:#fff;
  --green:#16a34a;--green-light:#dcfce7;
  --amber:#d97706;--amber-light:#fef3c7;
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh;}

/* ── Header ── */
.page-header{
  background:var(--white);border-bottom:2px solid var(--red);
  padding:0 28px;height:58px;display:flex;align-items:center;
  gap:16px;position:sticky;top:0;z-index:50;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.page-header .logo-sq{
  width:32px;height:32px;background:var(--red);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#fff;
}
.page-title{font-size:15px;font-weight:600;color:var(--ink);}
.page-sub{font-size:11px;color:var(--muted);margin-left:2px;}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
.btn{
  height:34px;padding:0 16px;border-radius:6px;font-size:13px;font-weight:500;
  font-family:'IBM Plex Sans',sans-serif;cursor:pointer;border:none;
  display:inline-flex;align-items:center;gap:6px;transition:all .14s;
}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-dark);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--slate);}
.btn-ghost:hover{border-color:var(--muted);color:var(--ink);}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:5px;}

/* ── Layout ── */
.layout{display:flex;height:calc(100vh - 58px);}
.sidebar{
  width:220px;flex-shrink:0;background:var(--white);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 0;
}
.sidebar-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 16px 8px;}
.cat-btn{
  width:100%;text-align:left;padding:9px 16px;background:none;border:none;cursor:pointer;
  font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;color:var(--slate);
  display:flex;align-items:center;gap:8px;transition:background .12s,color .12s;
  border-left:3px solid transparent;
}
.cat-btn:hover{background:var(--bg);color:var(--ink);}
.cat-btn.active{background:var(--red-light);color:var(--red);border-left-color:var(--red);}
.cat-btn svg{width:15px;height:15px;flex-shrink:0;stroke-width:1.8;}

/* ── Main ── */
.main{flex:1;overflow-y:auto;padding:24px 28px;}
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;gap:12px;
}
.section-title{font-size:17px;font-weight:600;color:var(--ink);}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);stroke-width:2;pointer-events:none;}
.search-input{
  height:34px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:6px;
  font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--white);
  width:240px;transition:border-color .14s;
}
.search-input:focus{outline:none;border-color:var(--red);}

/* ── Table ── */
.table-wrap{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{
  background:var(--bg);padding:10px 14px;text-align:left;
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{
  padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;
  font-size:13px;color:var(--ink);
}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg);}
.tbl .mono{font-family:'IBM Plex Mono',monospace;font-size:13px;}
.tbl .lieferant{font-weight:500;color:var(--ink);}
.tbl .material{color:var(--slate);}
.tbl .preis-cell{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--green);}
.tbl .preis-cell.auf-anfrage{color:var(--amber);font-size:11px;font-weight:500;}
.badge{
  display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;
  padding:2px 7px;border-radius:4px;
}
.badge-green{background:var(--green-light);color:var(--green);}
.badge-amber{background:var(--amber-light);color:var(--amber);}
.badge-red{background:var(--red-light);color:var(--red-dark);}

/* Edit & Delete buttons */
.row-actions{display:flex;gap:4px;opacity:0;transition:opacity .12s;}
tr:hover .row-actions{opacity:1;}
.icon-btn{
  width:28px;height:28px;border-radius:5px;border:1px solid var(--line);
  background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.icon-btn svg{width:14px;height:14px;stroke-width:1.8;}
.icon-btn.edit:hover{border-color:var(--red);color:var(--red);}
.icon-btn.del:hover{border-color:#ef4444;color:#ef4444;}

/* ── Modal ── */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  display:none;align-items:center;justify-content:center;z-index:200;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--white);border-radius:12px;padding:28px;
  width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
}
.modal-title{font-size:16px;font-weight:600;margin-bottom:20px;color:var(--ink);}
.form-row{margin-bottom:14px;}
.form-label{font-size:12px;font-weight:500;color:var(--slate);margin-bottom:5px;display:block;letter-spacing:.02em;}
.form-input,.form-select{
  width:100%;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:6px;
  font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--white);
  transition:border-color .14s;
}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--red);}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;}

/* Spinner */
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-left:8px;vertical-align:middle;transition:background .3s;}
.sync-dot.saving{background:var(--amber);}
.sync-dot.saved{background:var(--green);}

/* Empty state */
.empty{padding:48px;text-align:center;color:var(--muted);}
.empty svg{width:40px;height:40px;stroke:var(--muted);margin-bottom:12px;opacity:.4;}
</style>
</head>

  </main>
</div>

<div class="modal-backdrop" id="modal">

    <div class="form-row">

    <div class="form-row-2">

      <div class="form-row" style="margin-bottom:0">

          <option>€/Stk</option>

    </div>
    <div class="form-row" style="margin-top:14px">
      <label class="form-label">Notiz</label>

      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>

</div>

  {lieferant:'Fuchs Lubritech',material:'Trennmittel-Emulsionen',kategorie:'Schmierstoffe',preis:'+0,20',einheit:'€/l',notiz:'Zuschlag ab 2022'},
  {lieferant:'Fuchs Lubritech',material:'Schal- und Trennmittel',kategorie:'Schmierstoffe',preis:'+0,30',einheit:'€/l',notiz:'Zuschlag ab 2022'},
  {lieferant:'Fuchs Lubritech',material:'esterbasierte Trennmittel',kategorie:'Schmierstoffe',preis:'+0,50',einheit:'€/l',notiz:'Zuschlag ab 2022'},
  {lieferant:'Noeke Freienohl',material:'Kornhaus',kategorie:'Schmierstoffe',preis:'',einheit:'€/100l',notiz:'Auf Anfrage'},
];

// ── State ──
let data = {};
let editKey = null;
let currentCat = 'alle';

// ── Firebase ──
function setSyncing(state) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-status');
  dot.className = 'sync-dot ' + (state === 'saving' ? 'saving' : 'saved');
  lbl.innerHTML = (state === 'saving' ? 'Speichern…' : 'gespeichert') + ' <span class="sync-dot ' + (state === 'saving' ? 'saving' : 'saved') + '" id="sync-dot"></span>';
}

function initData() {
  REF.once('value', snap => {
    const val = snap.val();
    if (!val) {
      // Seed-Daten einmalig schreiben
      SEED.forEach(item => {
        item.id = Date.now() + Math.random();
        item.erstellt = new Date().toLocaleDateString('de-DE');
        REF.push(item);
      });
    }
  });
  REF.on('value', snap => {
    data = snap.val() || {};
    renderTable();
  });
}

function saveEntry() {
  const lieferant = document.getElementById('f-lieferant').value.trim();
  const material = document.getElementById('f-material').value.trim();
  if (!lieferant || !material) { alert('Lieferant und Material sind Pflichtfelder.'); return; }
  const entry = {
    lieferant,
    material,
    kategorie: document.getElementById('f-kategorie').value,
    preis: document.getElementById('f-preis').value.trim(),
    einheit: document.getElementById('f-einheit').value,
    notiz: document.getElementById('f-notiz').value.trim(),
    geaendert: new Date().toLocaleDateString('de-DE'),
  };
  setSyncing('saving');
  if (editKey) {
    REF.child(editKey).update(entry).then(() => setSyncing('saved'));
  } else {
    REF.push(entry).then(() => setSyncing('saved'));
  }
  closeModal();
}

function deleteEntry(key) {
  if (!confirm('Diesen Eintrag wirklich löschen?')) return;
  setSyncing('saving');
  REF.child(key).remove().then(() => setSyncing('saved'));
}

// ── UI ──
function setCategory(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('section-title').textContent =
    cat === 'alle' ? 'Alle Materialien' : cat;
  renderTable();
}

function renderTable() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const tbody = document.getElementById('table-body');
  const empty = document.getElementById('empty-state');
  let rows = Object.entries(data).filter(([k,v]) => {
    if (currentCat !== 'alle' && v.kategorie !== currentCat) return false;
    if (q) {
      const s = (v.lieferant + v.material + v.notiz + v.kategorie).toLowerCase();
      if (!s.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('count-label').textContent = rows.length + ' Einträge';
  if (!rows.length) { tbody.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  const catColors = {
    'Gesteinskörnung & Sand':'badge-green',
    'Asphalt':'badge-amber',
    'Beton':'badge-red',
    'Schmierstoffe':'badge-green',
    'Sonstige':'badge-amber',
  };
  tbody.innerHTML = rows.map(([k,v]) => `
    <tr>
      <td class="lieferant">${v.lieferant || '–'}</td>
      <td class="material">${v.material || '–'}</td>
      <td><span class="badge ${catColors[v.kategorie]||'badge-green'}">${v.kategorie||'–'}</span></td>
      <td class="${v.preis ? 'preis-cell' : 'preis-cell auf-anfrage'}">${v.preis ? v.preis + ' ' + (v.einheit||'') : 'Auf Anfrage'}</td>
      <td class="mono" style="color:var(--muted)">${v.einheit === 'Auf Anfrage' ? '' : (v.einheit||'')}</td>
      <td style="color:var(--muted);font-size:12px">${v.notiz||''}</td>
      <td>
        <div class="row-actions">
          <button class="icon-btn edit" title="Bearbeiten" onclick="openModal('${k}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn del" title="Löschen" onclick="deleteEntry('${k}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </td>
    </tr>`).join('');
}

function openModal(key) {
  editKey = key || null;
  document.getElementById('modal-title').textContent = key ? 'Material bearbeiten' : 'Neues Material';
  if (key && data[key]) {
    const v = data[key];
    document.getElementById('f-lieferant').value = v.lieferant || '';
    document.getElementById('f-material').value = v.material || '';
    document.getElementById('f-kategorie').value = v.kategorie || 'Sonstige';
    document.getElementById('f-preis').value = v.preis || '';
    document.getElementById('f-einheit').value = v.einheit || '€/t';
    document.getElementById('f-notiz').value = v.notiz || '';
  } else {
    ['f-lieferant','f-material','f-preis','f-notiz'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-kategorie').value = 'Gesteinskörnung & Sand';
    document.getElementById('f-einheit').value = '€/t';
  }
  document.getElementById('modal').classList.add('open');
  document.getElementById('f-lieferant').focus();
}
function closeModal() { document.getElementById('modal').classList.remove('open'); editKey = null; }
document.getElementById('modal').addEventListener('click', e => { if(e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

// ── Init ──
try { initData(); }
catch(e) {
  // Falls Firebase-Config fehlt, statische Demo-Daten zeigen
  SEED.forEach((s,i) => data['seed_'+i] = s);
  renderTable();
  document.getElementById('sync-status').textContent = '⚠ Firebase nicht verbunden';
}
</script>
</body>
</html>
