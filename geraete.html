<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geräte- & Fahrzeug-Manager | Hilgenroth</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;}
body{font-family:'IBM Plex Sans',sans-serif;background:#F7F8FA;color:#1B1D22;font-size:14px;display:flex;flex-direction:column;}
:root{
  --red:#C8102E;--red-d:#9E0C24;--red-l:#FCE9EC;
  --ink:#1B1D22;--slate:#4A4F58;--muted:#8A909B;
  --line:#E6E8EC;--bg:#F7F8FA;--white:#fff;
  --green:#16a34a;--green-l:#dcfce7;
  --amber:#d97706;--amber-l:#fef3c7;
  --blue:#1d4ed8;--blue-l:#dbeafe;
  --red-warn:#dc2626;
}

/* Nav */
.nav{display:flex;background:var(--white);border-bottom:1px solid var(--line);padding:0 20px;flex-shrink:0;align-items:center;}
.ntab{height:42px;padding:0 14px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;transition:.14s;white-space:nowrap;}
.ntab:hover{color:var(--ink);}
.ntab.on{color:var(--red);border-bottom-color:var(--red);font-weight:600;}
.ntab svg{width:14px;height:14px;stroke-width:1.8;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--amber);}
.sdot.on{background:var(--green);}
.slbl{font-size:11px;color:var(--muted);}

/* Layout */
.wrap{display:flex;flex:1;overflow:hidden;}
.side{width:200px;flex-shrink:0;background:var(--white);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0;}
.side-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 14px 4px;}
.cat-btn{width:100%;text-align:left;padding:7px 14px;background:none;border:none;border-left:3px solid transparent;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--slate);display:flex;align-items:center;justify-content:space-between;transition:.12s;}
.cat-btn:hover{background:var(--bg);color:var(--ink);}
.cat-btn.on{background:var(--red-l);color:var(--red);border-left-color:var(--red);}
.cat-btn .cnt{font-size:10px;font-family:'IBM Plex Mono',monospace;}
.cat-edit{width:20px;height:20px;border:none;background:none;cursor:pointer;color:var(--muted);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:.12s;}
.cat-btn:hover .cat-edit{opacity:1;}
.cat-edit:hover{color:var(--red);background:var(--red-l);}
.cat-edit svg{width:11px;height:11px;stroke-width:2;}
.add-cat{width:100%;text-align:left;padding:7px 14px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-family:'IBM Plex Sans',sans-serif;transition:.12s;}
.add-cat:hover{color:var(--red);}

/* Main */
.main{flex:1;overflow-y:auto;padding:18px 22px;}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.pht{font-size:16px;font-weight:600;}
.ph-r{display:flex;gap:8px;align-items:center;}

/* Buttons */
.btn{height:30px;padding:0 13px;border-radius:6px;font-size:12px;font-weight:500;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:.14s;white-space:nowrap;}
.btn-p{background:var(--red);color:#fff;}.btn-p:hover{background:var(--red-d);}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--slate);}.btn-g:hover{border-color:var(--muted);color:var(--ink);}
.btn-sm{height:26px;padding:0 9px;font-size:11px;border-radius:4px;}

/* Suche */
.swrap{position:relative;}
.swrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);stroke-width:2;pointer-events:none;}
.sinp{height:30px;padding:0 10px 0 30px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--ink);background:var(--white);width:200px;}
.sinp:focus{outline:none;border-color:var(--red);}

/* Karten-Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;transition:.14s;cursor:pointer;}
.card:hover{border-color:var(--red);box-shadow:0 2px 10px rgba(200,16,46,.08);}
.card.warn{border-left:4px solid var(--amber);}
.card.overdue{border-left:4px solid var(--red-warn);}
.card-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px;}
.card-name{font-size:14px;font-weight:700;color:var(--ink);}
.card-nr{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
.card-kat{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--blue-l);color:var(--blue);}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
.card-field{font-size:11px;}
.card-field .lbl{color:var(--muted);margin-bottom:1px;}
.card-field .val{font-weight:500;color:var(--ink);}
.card-field .val.warn{color:var(--amber);font-weight:600;}
.card-field .val.ok{color:var(--green);}
.card-field .val.over{color:var(--red-warn);font-weight:600;}
.card-actions{display:flex;gap:4px;margin-top:12px;justify-content:flex-end;}
.ib{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ib svg{width:13px;height:13px;stroke-width:1.8;}
.ib.e:hover{border-color:var(--red);color:var(--red);}
.ib.d:hover{border-color:#ef4444;color:#ef4444;}

/* Status-Badges */
.status-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.sbadge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:3px;}
.sbadge svg{width:10px;height:10px;stroke-width:2.5;}
.sbadge.ok{background:var(--green-l);color:var(--green);}
.sbadge.warn{background:var(--amber-l);color:var(--amber);}
.sbadge.over{background:#fee2e2;color:var(--red-warn);}

/* Tabellen-Ansicht */
.twrap{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{background:var(--bg);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg);}
.ra{display:flex;gap:3px;opacity:0;transition:.12s;}
tr:hover .ra{opacity:1;}

/* Modal */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:200;}
.bd.on{display:flex;}
.md{background:var(--white);border-radius:10px;padding:24px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.14);}
.mdt{font-size:15px;font-weight:600;margin-bottom:18px;}
.fr{margin-bottom:12px;}
.fr label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);display:block;margin-bottom:4px;}
.fi,.fs{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--white);}
.fi:focus,.fs:focus{outline:none;border-color:var(--red);}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.ma{display:flex;gap:7px;justify-content:flex-end;margin-top:18px;}
.divider{height:1px;background:var(--line);margin:16px 0;}
.section-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;}

.empty{padding:40px;text-align:center;color:var(--muted);}
.rep-timeline{display:flex;flex-direction:column;gap:0;}
.rep-entry{display:flex;gap:0;position:relative;}
.rep-line{display:flex;flex-direction:column;align-items:center;width:36px;flex-shrink:0;}
.rep-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--white);flex-shrink:0;margin-top:4px;z-index:1;}
.rep-dot.Reparatur{background:var(--amber);}
.rep-dot.Wartung{background:var(--green);}
.rep-dot.Unfall{background:var(--red-warn);}
.rep-dot.TÜV{background:var(--blue);}
.rep-dot.Neukauf{background:#7c3aed;}
.rep-dot.Sonstiges{background:var(--muted);}
.rep-dot.Rechnungskorrektur{background:var(--green);}
.rep-vline{width:2px;background:var(--line);flex:1;margin-top:0;}
.rep-content{flex:1;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;margin-left:8px;}
.rep-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;}
.rep-art{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;}
.rep-art.Reparatur{background:var(--amber-l);color:var(--amber);}
.rep-art.Wartung{background:var(--green-l);color:var(--green);}
.rep-art.Unfall{background:#fee2e2;color:var(--red-warn);}
.rep-art.TÜV{background:var(--blue-l);color:var(--blue);}
.rep-art.Neukauf{background:#ede9fe;color:#7c3aed;}
.rep-art.Sonstiges{background:var(--line);color:var(--slate);}
.rep-art.Rechnungskorrektur{background:var(--green-l);color:var(--green);}
.rep-preis{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;color:var(--red-warn);}
.rep-beschr{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.rep-meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;}
.back-btn{display:flex;align-items:center;gap:7px;margin-bottom:16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--slate);}
.back-btn:hover{color:var(--red);}
.back-btn svg{width:15px;height:15px;stroke-width:2;}
.detail-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:18px;}
.stat-box{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px 14px;}
.stat-box .s-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px;}
.stat-box .s-val{font-size:15px;font-weight:700;color:var(--ink);}
.stat-box .s-val.red{color:var(--red-warn);}
.empty svg{width:36px;height:36px;stroke:var(--muted);margin:0 auto 10px;display:block;opacity:.3;}
.view-toggle{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.upload-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:5px;border:1px dashed var(--line);background:var(--bg);color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;transition:.14s;font-family:inherit;}
.upload-btn:hover{border-color:var(--red);color:var(--red);}
.upload-btn svg{width:12px;height:12px;stroke-width:2;}
.pdf-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--red);text-decoration:none;padding:2px 7px;border-radius:4px;background:var(--red-l);}
.pdf-link svg{width:11px;height:11px;stroke-width:2;}
.prog-wrap{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;display:none;}
.prog-bar{height:100%;background:var(--red);border-radius:2px;transition:width .2s;}
.vt-btn{height:28px;width:30px;border:none;background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.12s;}
.vt-btn.on{background:var(--red);color:#fff;}
.vt-btn svg{width:14px;height:14px;stroke-width:1.8;}
</style>
</head>
<body>

<div class="nav">
  <button class="ntab on" id="nt-all" onclick="goTab('all')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Alle Geräte
  </button>
  <button class="ntab" id="nt-due" onclick="goTab('due')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Fällige Prüfungen
  </button>
  <button class="ntab" id="nt-ws" onclick="goTab('ws')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Werkstätten & Lieferanten
  </button>
  <button class="ntab" id="nt-imp" onclick="goTab('imp')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Import
  </button>
  <div class="nav-right">
    <span class="sdot" id="sdot"></span><span class="slbl" id="slbl">verbinde …</span>
  </div>
</div>

<div class="wrap">
  <aside class="side">
    <div class="side-lbl">Kategorien</div>
    <button class="cat-btn on" id="cb-alle" onclick="setCat(null,this)">
      <span>Alle</span><span class="cnt" id="cnt-alle"></span>
    </button>
    <div id="cat-list"></div>
    <button class="add-cat" onclick="openCatModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="13" height="13" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Kategorie hinzufügen
    </button>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- Gerät Modal -->
<div class="bd" id="bd-geraet">
  <div class="md">
    <div class="mdt" id="g-title">Neues Gerät / Fahrzeug</div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>Bezeichnung *</label><input class="fi" id="g-name" placeholder="z.B. Bagger Liebherr"></div>
      <div class="fr" style="margin:0"><label>Kategorie</label><select class="fs" id="g-kat" onchange="updateBstLabel()"></select></div>
    </div>
    <div class="fr2" style="margin-top:12px">
      <div class="fr" style="margin:0"><label>Kennzeichen</label><input class="fi" id="g-kz" placeholder="z.B. SO-HI 123"></div>
      <div class="fr" style="margin:0"><label>Seriennummer</label><input class="fi" id="g-sn" placeholder="z.B. SN-2024-001"></div>
    </div>
    <div class="fr" style="margin-top:12px"><label>Standort / Ort</label><input class="fi" id="g-ort" placeholder="z.B. Hellefeld, Bauhof"></div>
    <div class="divider"></div>
    <div class="section-lbl">Anschaffung & Betrieb</div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>Anschaffungsdatum</label><input class="fi" type="date" id="g-datum"></div>
      <div class="fr" style="margin:0"><label id="g-bst-lbl">Betriebsstunden / km</label><input class="fi" id="g-bst" placeholder="z.B. 4500" type="number"></div>
    </div>
    <div class="divider"></div>
    <div class="section-lbl">TÜV / Prüftermine</div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>HU fällig am</label><input class="fi" type="date" id="g-hu"></div>
      <div class="fr" style="margin:0"><label>SP fällig am</label><input class="fi" type="date" id="g-sp"></div>
    </div>
    <div class="fr" style="margin-top:12px"><label>Weitere Prüfung (z.B. UVV)</label>
      <div class="fr2" style="gap:6px">
        <input class="fi" id="g-pruef-name" placeholder="Bezeichnung z.B. UVV">
        <input class="fi" type="date" id="g-pruef-date">
      </div>
    </div>
    <div class="divider"></div>
    <div class="fr"><label>Notiz</label><input class="fi" id="g-notiz" placeholder="z.B. Ölwechsel fällig, Defekte …"></div>
    <div class="ma">
      <button class="btn btn-g" onclick="closeM('bd-geraet')">Abbrechen</button>
      <button class="btn btn-p" onclick="saveGeraet()">Speichern</button>
    </div>
  </div>
</div>

<!-- Angebot Modal -->
<div class="bd" id="bd-ang">
  <div class="md" style="width:480px">
    <div class="mdt" id="ang-title">Angebot erfassen</div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>Datum *</label><input class="fi" type="date" id="ang-datum"></div>
      <div class="fr" style="margin:0"><label>Status</label>
        <select class="fs" id="ang-status">
          <option value="Offen">Offen</option>
          <option value="Angenommen">Angenommen</option>
          <option value="Abgelehnt">Abgelehnt</option>
          <option value="Zu den Akten">Zu den Akten</option>
        </select>
      </div>
    </div>
    <div class="fr" style="margin-top:11px"><label>Beschreibung / Betreff *</label>
      <input class="fi" id="ang-beschr" placeholder="z.B. Austausch Hydraulikpumpe, Felstieflöffel B11 …">
    </div>
    <div class="fr"><label>Lieferant / Anbieter</label>
      <div style="display:flex;gap:6px">
        <select class="fs" id="ang-lief-sel" onchange="if(this.value)document.getElementById('ang-lief').value=this.value" style="flex:1">
          <option value="">— aus gespeicherten —</option>
        </select>
        <input class="fi" id="ang-lief" placeholder="oder neu eingeben" style="flex:1">
      </div>
    </div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>Angebotsnummer</label><input class="fi" id="ang-nr" placeholder="z.B. ANG-2026-001"></div>
      <div class="fr" style="margin:0"><label>Preis netto (€)</label><input class="fi" id="ang-preis" placeholder="z.B. 4.500,00" oninput="cleanRepPreis(this)"></div>
    </div>
    <div class="fr"><label>Dokument / Angebot (PDF oder Link)</label>
      <div style="display:flex;gap:6px">
        <input class="fi" id="ang-link" placeholder="Link einfügen …" style="flex:1">
        <label class="upload-btn" for="ang-pdf-inp" style="flex-shrink:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          PDF
        </label>
        <input type="file" id="ang-pdf-inp" accept="application/pdf" style="display:none" onchange="handleAngPDF(this)">
      </div>
      <div class="prog-wrap" id="ang-prog-wrap"><div class="prog-bar" id="ang-prog-bar" style="width:0%"></div></div>
      <div id="ang-pdf-preview" style="margin-top:6px"></div>
    </div>
    <div class="fr"><label>Notiz</label>
      <input class="fi" id="ang-notiz" placeholder="z.B. günstiger als Vorjahr, Lieferzeit 4 Wochen"></div>
    <div class="ma">
      <button class="btn btn-g" onclick="closeM('bd-ang')">Abbrechen</button>
      <button class="btn btn-p" onclick="saveAng()">Speichern</button>
    </div>
  </div>
</div>

<!-- Werkstatt Modal -->
<div class="bd" id="bd-ws">
  <div class="md" style="width:440px">
    <div class="mdt" id="ws-title">Werkstatt / Lieferant</div>
    <div class="fr"><label>Name *</label><input class="fi" id="ws-name" placeholder="z.B. Werkstatt Müller"></div>
    <div class="fr"><label>Kategorie / Schwerpunkt</label>
      <select class="fs" id="ws-kat">
        <option value="">— alle Kategorien —</option>
        <option>Reparatur</option>
        <option>Wartung</option>
        <option>TÜV / Prüfung</option>
        <option>Reifenservice</option>
        <option>Ersatzteile / Neukauf</option>
        <option>Elektrik</option>
        <option>Hydraulik</option>
        <option>Sonstiges</option>
      </select>
    </div>

<script>
// ── Firebase (Dispo-Hellefeld) ──
let db=null, GR=null, KR=null, RR=null, WR=null, AR=null, ST=null;
try {
  if(typeof firebase !== 'undefined'){
    firebase.initializeApp({
      apiKey:"AIzaSyAuU6mF5p5JQ5qvwLVbYUGc1v-HoQ8ZUMw",
      authDomain:"dispo-hellefeld.firebaseapp.com",
      databaseURL:"https://dispo-hellefeld-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:"dispo-hellefeld",
      storageBucket:"dispo-hellefeld.firebasestorage.app",
      messagingSenderId:"34994251645",
      appId:"1:34994251645:web:2f8a076d385bb245354e14"
    });
    db = firebase.database();
    GR = db.ref('geraete/items');
    KR = db.ref('geraete/kategorien');
    RR = db.ref('geraete/reparaturen');
    WR = db.ref('geraete/werkstaetten');
    AR = db.ref('geraete/angebote');
    ST = firebase.storage();
  }
} catch(e){ console.warn('Firebase:', e.message); }

// ── State ──
let geraete={}, kats={}, reparaturen={}, werkstaetten={}, angebote={};
let curKat=null, curTab='all', curGeraetDetail=null, detailSubTab='verlauf', geraetKey=null, katKey=null, repKey=null, angKey=null, wsKey=null, viewMode='grid', sq='';

// ── Farben ──
const COLORS={
  blue:{bg:'#dbeafe',col:'#1d4ed8'},
  green:{bg:'#dcfce7',col:'#16a34a'},
  amber:{bg:'#fef3c7',col:'#d97706'},
  red:{bg:'#fee2e2',col:'#dc2626'},
  purple:{bg:'#ede9fe',col:'#7c3aed'},
  gray:{bg:'#f1f5f9',col:'#64748b'},
};

// ── Standard-Kategorien ──
const DEFAULT_KATS=[
  {name:'Baumaschinen',color:'amber'},
  {name:'Fahrzeuge',color:'blue'},
  {name:'Anhänger',color:'gray'},
  {name:'Werkzeuge & Geräte',color:'green'},
];

// ── Helpers ──
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sync(on){document.getElementById('sdot').className='sdot'+(on?' on':'');document.getElementById('slbl').textContent=on?'synchronisiert':'offline';}

// ── Datum-Helpers ──
function daysUntil(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr), now=new Date();
  now.setHours(0,0,0,0);
  return Math.round((d-now)/(1000*60*60*24));
}
function fmtDate(d){if(!d)return'–';const p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function statusClass(days){
  if(days===null)return'';
  if(days<0)return'over';
  if(days<=30)return'warn';
  return'ok';
}
function statusLabel(days){
  if(days===null)return'–';
  if(days<0)return`${Math.abs(days)} Tage überfällig`;
  if(days===0)return'Heute fällig!';
  if(days<=30)return`in ${days} Tagen`;
  return fmtDate;
}

// ── Tab ──
function goTab(t){
  curTab=t;
  curGeraetDetail=null;
  ['all','due','ws','imp'].forEach(id=>{
    const el=document.getElementById('nt-'+id);
    if(el)el.className='ntab'+(t===id?' on':'');
  });
  draw();
}

// ── Kategorie ──
function setCat(kat,btn){
  curKat=kat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  draw();
}

// ── Sidebar ──
function buildSidebar(){
  const list=document.getElementById('cat-list');
  const total=Object.keys(geraete).length;
  document.getElementById('cnt-alle').textContent=total;
  list.innerHTML=Object.entries(kats).sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([k,v])=>{
    if(!v||!v.name)return'';
    const cnt=Object.values(geraete).filter(g=>g&&g.kategorie===v.name).length;
    const col=COLORS[v.color||'blue'];
    return `<button class="cat-btn${curKat===v.name?' on':''}" onclick="setCat('${esc(v.name)}',this)">
      <span style="display:flex;align-items:center;gap:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:${col.col};flex-shrink:0"></span>
        ${esc(v.name)}
      </span>
      <span style="display:flex;align-items:center;gap:4px">
        <span class="cnt">${cnt}</span>
        <button class="cat-edit" onclick="event.stopPropagation();openCatModal('${k}')" title="Bearbeiten">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </button>
      </span>
    </button>`;
  }).join('');
}

// ── Kategorie-Select im Gerät-Modal ──
function fillKatSel(){
  const sel=document.getElementById('g-kat');
  const cur=sel.value;
  sel.innerHTML='<option value="">— wählen —</option>'+
    Object.values(kats).filter(v=>v&&v.name).sort((a,b)=>a.name.localeCompare(b.name))
    .map(v=>`<option value="${esc(v.name)}"${v.name===cur?' selected':''}>${esc(v.name)}</option>`).join('');
}

// ── Draw ──
function draw(){
  buildSidebar();
  fillKatSel();
  if(curTab==='due') drawDue();
  else if(curTab==='detail') drawDetail();
  else if(curTab==='ws') drawWerkstaetten();
  else if(curTab==='imp') drawImport();
  else drawAll();
}

// ── Alle Geräte ──
function drawAll(){
  const main=document.getElementById('main');
  let items=Object.entries(geraete).filter(([k,v])=>v&&v.name);
  if(curKat) items=items.filter(([k,v])=>v.kategorie===curKat);
  if(sq) items=items.filter(([k,v])=>((v.name||'')+(v.kz||'')+(v.sn||'')+(v.ort||'')+(v.notiz||'')).toLowerCase().includes(sq));
  items.sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));

  let html=`<div class="ph">
    <div class="pht">${curKat||'Alle Geräte & Fahrzeuge'}</div>
    <div class="ph-r">
      <div class="swrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="sinp" id="sq-inp" placeholder="Suchen …" value="${esc(sq)}">
      </div>
      <div class="view-toggle">
        <button class="vt-btn${viewMode==='grid'?' on':''}" onclick="viewMode='grid';draw()" title="Kacheln">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button class="vt-btn${viewMode==='list'?' on':''}" onclick="viewMode='list';draw()" title="Liste">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
      <span style="font-size:12px;color:var(--muted)">${items.length} Geräte</span>
      <button class="btn btn-p" onclick="openGeraet()">+ Gerät / Fahrzeug</button>
    </div>
  </div>`;

  if(!items.length){
    html+=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/></svg><p>Noch keine Geräte eingetragen</p></div>`;
  } else if(viewMode==='grid'){
    html+=`<div class="grid">`;
    items.forEach(([k,v])=>{ html+=buildCard(k,v); });
    html+=`</div>`;
  } else {
    html+=buildTable(items);
  }
  main.innerHTML=html;
  const inp=document.getElementById('sq-inp');
  if(inp){ inp.addEventListener('input',function(){sq=this.value.toLowerCase();drawAll();}); const l=inp.value.length;inp.setSelectionRange(l,l); }
}

// ── Fällige Prüfungen ──
function drawDue(){
  const main=document.getElementById('main');
  const WARN_DAYS=60;
  let items=Object.entries(geraete).filter(([k,v])=>{
    if(!v||!v.name)return false;
    const hu=daysUntil(v.hu), sp=daysUntil(v.sp), pp=daysUntil(v.pruefDate);
    return (hu!==null&&hu<=WARN_DAYS)||(sp!==null&&sp<=WARN_DAYS)||(pp!==null&&pp<=WARN_DAYS);
  });
  items.sort((a,b)=>{
    const minA=Math.min(...[a[1].hu,a[1].sp,a[1].pruefDate].map(d=>daysUntil(d)??999));
    const minB=Math.min(...[b[1].hu,b[1].sp,b[1].pruefDate].map(d=>daysUntil(d)??999));
    return minA-minB;
  });
  let html=`<div class="ph"><div class="pht">Fällige Prüfungen <span style="font-size:13px;color:var(--muted);font-weight:400">(nächste 60 Tage)</span></div><span style="font-size:12px;color:var(--muted)">${items.length} Geräte</span></div>`;
  if(!items.length){
    html+=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg><p>Keine fälligen Prüfungen in den nächsten 60 Tagen</p></div>`;
  } else {
    html+=`<div class="grid">`;
    items.forEach(([k,v])=>{ html+=buildCard(k,v,true); });
    html+=`</div>`;
  }
  main.innerHTML=html;
}

// ── Karte bauen ──
function buildCard(k,v,fälligOnly=false){
  const hu=daysUntil(v.hu), sp=daysUntil(v.sp), pp=daysUntil(v.pruefDate);
  const minDays=Math.min(...[hu,sp,pp].filter(d=>d!==null));
  const isWarn=minDays!==null&&minDays<=30&&minDays>=0;
  const isOver=minDays!==null&&minDays<0;
  const kat=Object.values(kats).find(c=>c&&c.name===v.kategorie);
  const col=kat?COLORS[kat.color||'blue']:COLORS.blue;

  const statusBadge=(days,label)=>{
    if(days===null)return'';
    const sc=statusClass(days);
    const txt=days<0?`${Math.abs(days)}d überfällig`:days===0?'Heute!':days<=30?`${days}d`:fmtDate(days<0?'':v.hu||v.sp||'');
    return `<span class="sbadge ${sc}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ${label}: ${days<0?`${Math.abs(days)}d überfällig`:days===0?'Heute!':days<=30?`in ${days}d`:'OK'}
    </span>`;
  };

  return `<div class="card${isOver?' overdue':isWarn?' warn':''}" onclick="showDetail('${k}')">
    <div class="card-head">
      <div>
        <div class="card-name">${esc(v.name)}</div>
        ${v.kz?`<div class="card-nr">${esc(v.kz)}</div>`:''}
        ${v.sn?`<div class="card-nr" style="color:var(--muted)">SN: ${esc(v.sn)}</div>`:''}
      </div>
      <span class="card-kat" style="background:${col.bg};color:${col.col}">${esc(v.kategorie||'–')}</span>
    </div>
    <div class="card-body">
      ${v.ort?`<div class="card-field"><div class="lbl">Standort</div><div class="val">${esc(v.ort)}</div></div>`:''}
      ${v.bst?`<div class="card-field"><div class="lbl">${['Fahrzeuge','Anhänger'].includes(v.kategorie)?'Kilometerstand':'Betriebsstunden'}</div><div class="val">${esc(v.bst)} ${['Fahrzeuge','Anhänger'].includes(v.kategorie)?'km':'h'}</div></div>`:''}
      ${v.datum?`<div class="card-field"><div class="lbl">Anschaffung</div><div class="val">${fmtDate(v.datum)}</div></div>`:''}
      ${v.hu?`<div class="card-field"><div class="lbl">HU fällig</div><div class="val ${statusClass(hu)}">${fmtDate(v.hu)}</div></div>`:''}
      ${v.sp?`<div class="card-field"><div class="lbl">SP fällig</div><div class="val ${statusClass(sp)}">${fmtDate(v.sp)}</div></div>`:''}
      ${v.pruefName&&v.pruefDate?`<div class="card-field"><div class="lbl">${esc(v.pruefName)}</div><div class="val ${statusClass(pp)}">${fmtDate(v.pruefDate)}</div></div>`:''}
    </div>
    ${(hu!==null&&hu<=60)||(sp!==null&&sp<=60)||(pp!==null&&pp<=60)?`<div class="status-row">
      ${hu!==null&&hu<=60?statusBadge(hu,'HU'):''}
      ${sp!==null&&sp<=60?statusBadge(sp,'SP'):''}
      ${pp!==null&&pp<=60?statusBadge(pp,v.pruefName||'Prüfung'):''}
    </div>`:''}
    ${v.notiz?`<div style="font-size:11px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:6px">${esc(v.notiz)}</div>`:''}
    <div class="card-actions">
      <button class="ib e" onclick="event.stopPropagation();openGeraet('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
      <button class="ib d" onclick="event.stopPropagation();delGeraet('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>
  </div>`;
}

// ── Tabelle ──
function buildTable(items){
  return `<div class="twrap"><table class="tbl"><thead><tr>
    <th>Bezeichnung</th><th>Kategorie</th><th>Kennzeichen</th><th>Standort</th><th>Betr.std./km</th><th>HU</th><th>SP</th><th>Notiz</th><th></th>
  </tr></thead><tbody>${items.map(([k,v])=>{
    const hu=daysUntil(v.hu),sp=daysUntil(v.sp);
    const kat=Object.values(kats).find(c=>c&&c.name===v.kategorie);
    const col=kat?COLORS[kat.color||'blue']:COLORS.blue;
    return `<tr onclick="showDetail('${k}')" style="cursor:pointer">
      <td style="font-weight:600">${esc(v.name)}</td>
      <td><span style="font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:${col.bg};color:${col.col}">${esc(v.kategorie||'–')}</span></td>
      <td class="mono">${esc(v.kz||'–')}</td>
      <td style="color:var(--slate)">${esc(v.ort||'–')}</td>
      <td class="mono">${v.bst?esc(v.bst)+(['Fahrzeuge','Anhänger'].includes(v.kategorie)?' km':' h'):'–'}</td>
      <td class="${statusClass(hu)}" style="font-weight:${hu!==null&&hu<=30?'600':'400'}">${fmtDate(v.hu)}</td>
      <td class="${statusClass(sp)}" style="font-weight:${sp!==null&&sp<=30?'600':'400'}">${fmtDate(v.sp)}</td>
      <td style="font-size:12px;color:var(--muted)">${esc(v.notiz||'')}</td>
      <td><div class="ra">
        <button class="ib e" onclick="event.stopPropagation();openGeraet('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>

// ── Werkstatt CRUD ──
function openWS(key){
  wsKey=key||null;
  document.getElementById('ws-title').textContent=key?'Werkstatt bearbeiten':'Werkstatt / Lieferant hinzufügen';
  document.getElementById('del-ws-btn').style.display=key?'':'none';
  if(key&&werkstaetten[key]){
    const v=werkstaetten[key];
    document.getElementById('ws-name').value=v.name||'';
    document.getElementById('ws-kat').value=v.kat||'';
    document.getElementById('ws-tel').value=v.tel||'';
    document.getElementById('ws-mob').value=v.mob||'';
    document.getElementById('ws-mail').value=v.mail||'';
    document.getElementById('ws-ap').value=v.ap||'';
    document.getElementById('ws-notiz').value=v.notiz||'';
  } else {
    ['ws-name','ws-tel','ws-mob','ws-mail','ws-ap','ws-notiz'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ws-kat').value='';
  }
  openM('bd-ws');
}
function saveWS(){
  const name=document.getElementById('ws-name').value.trim();
  if(!name){alert('Name ist Pflichtfeld.');return;}
  const e={name,kat:document.getElementById('ws-kat').value,tel:document.getElementById('ws-tel').value.trim(),mob:document.getElementById('ws-mob').value.trim(),mail:document.getElementById('ws-mail').value.trim(),ap:document.getElementById('ws-ap').value.trim(),notiz:document.getElementById('ws-notiz').value.trim(),ts:Date.now()};
  if(wsKey){if(WR)WR.child(wsKey).update(e);werkstaetten[wsKey]={...werkstaetten[wsKey],...e};}
  else{const k=WR?WR.push().key:'w_'+Date.now();if(WR)WR.child(k).set(e);werkstaetten[k]=e;}
  closeM('bd-ws');
  if(curTab==='ws')drawWerkstaetten();
  fillWerkSel();
}
function delWS(k){
  const key=k||wsKey;
  if(!key)return;
  if(!confirm(`"${werkstaetten[key]?.name}" löschen?`))return;
  if(WR)WR.child(key).remove();
  delete werkstaetten[key];
  closeM('bd-ws');
  if(curTab==='ws')drawWerkstaetten();
  fillWerkSel();
}

function fillWerkSel(){
  const sel=document.getElementById('rep-firma-sel');
  if(!sel)return;
  const cur=sel.value;
  const names=[...new Set(Object.values(werkstaetten).filter(w=>w&&w.name).map(w=>w.name))].sort();
  sel.innerHTML='<option value="">— aus gespeicherten wählen —</option>'+
    names.map(n=>`<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('');
}

// ── PDF Upload ──
function uploadPDF(file, path, onDone){
  if(!ST){alert('Firebase Storage nicht verfügbar.');return;}
  if(!file||file.type!=='application/pdf'){alert('Bitte nur PDF-Dateien hochladen.');return;}
  if(file.size>10*1024*1024){alert('Maximale Dateigröße: 10 MB.');return;}
  const ref=ST.ref(path+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'));
  const task=ref.put(file);
  const wrap=document.getElementById('upload-prog-wrap');
  const bar=document.getElementById('upload-prog-bar');
  if(wrap)wrap.style.display='';
  task.on('state_changed',
    snap=>{const pct=Math.round(snap.bytesTransferred/snap.totalBytes*100);if(bar)bar.style.width=pct+'%';},
    err=>{alert('Upload-Fehler: '+err.message);if(wrap)wrap.style.display='none';},
    ()=>{ref.getDownloadURL().then(url=>{if(wrap)wrap.style.display='none';onDone(url,file.name);});}
  );
}

function saveWerkstatt(name){
  // Nur speichern wenn noch nicht vorhanden
  if(!name||Object.values(werkstaetten).find(w=>w&&w.name===name))return;
  const k=WR?WR.push().key:'w_'+Date.now();
  const e={name,kat:'',ts:Date.now()};
  if(WR)WR.child(k).set(e);
  werkstaetten[k]=e;
  fillWerkSel();
}

function openRep(geraetId){
  repKey=null;
  document.getElementById('rep-title').textContent='Reparatur / Ereignis erfassen';
  document.getElementById('rep-datum').value=new Date().toISOString().slice(0,10);
  ['rep-beschr','rep-rgnr','rep-preis','rep-firma','rep-notiz'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('rep-art').value='Reparatur';
  document.getElementById('bd-rep').dataset.geraetId=geraetId;
  fillWerkSel();
  // PDF-Preview zurücksetzen
  const prev=document.getElementById('rep-pdf-preview');
  const urlInp=document.getElementById('rep-pdf-url');
  const nameInp=document.getElementById('rep-pdf-name');
  if(prev) prev.innerHTML='';
  if(urlInp) urlInp.value='';
  if(nameInp) nameInp.value='';
  openM('bd-rep');
}
function cleanRepPreis(inp){
  const neg=inp.value.startsWith('-');
  let v=inp.value.replace(/[^0-9,\.]/g,'');
  const f=v.search(/[,.]/);
  if(f>=0)v=v.slice(0,f+1)+v.slice(f+1).replace(/[,.]/g,'');
  inp.value=(neg?'-':'')+v;
}
function saveRep(){
  const beschr=document.getElementById('rep-beschr').value.trim();
  if(!beschr){alert('Beschreibung ist Pflichtfeld.');return;}

// ══════════════ IMPORT (Excel) ══════════════
let impRows=null, impStats=null;

const ART_MAP={
  'reparatur':'Reparatur','wartung':'Wartung','inspektion':'Wartung',
  'tüv':'TÜV/Prüfung','tuev':'TÜV/Prüfung','tüv/prüfung':'TÜV/Prüfung','prüfung':'TÜV/Prüfung','hu':'TÜV/Prüfung',
  'unfall':'Unfall/Schaden','schaden':'Unfall/Schaden','unfall/schaden':'Unfall/Schaden',
  'rechnungskorrektur':'Rechnungskorrektur','gutschrift':'Rechnungskorrektur','storno':'Rechnungskorrektur',
  'neukauf':'Neukauf/Ersatz','neukauf/ersatz':'Neukauf/Ersatz','sonstiges':'Sonstiges'
};
function mapArt(a){
  const k=String(a||'').trim().toLowerCase();
  return ART_MAP[k]|| (k?'Sonstiges':'Reparatur');
}
function normKz(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function impDate(v){
  if(v instanceof Date && !isNaN(v)) return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const s=String(v||'').trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if(m){let y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}
  const n=parseFloat(s);
  if(!isNaN(n)&&n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+n*864e5);return d.toISOString().slice(0,10);}
  return '';
}
function impPreis(v){
  if(typeof v==='number') return (Math.round(v*100)/100).toFixed(2).replace('.',',');
  let s=String(v||'').replace(/[€\s]/g,'');
  if(!s) return '';
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?'':(Math.round(n*100)/100).toFixed(2).replace('.',',');
}
function col(row,names){
  for(const n of names){
    const hit=Object.keys(row).find(k=>k.trim().toLowerCase().replace(/\s+/g,' ')===n);
    if(hit!==undefined) return row[hit];
  }
  // Teiltreffer
  for(const n of names){
    const hit=Object.keys(row).find(k=>k.trim().toLowerCase().includes(n));
    if(hit!==undefined) return row[hit];
  }
  return '';
}

function drawImport(){
  const main=document.getElementById('main');
  main.innerHTML=`
    <div class="ph"><div class="pht">Import aus Excel</div>
      <span style="font-size:12px;color:var(--muted)">Reparaturen, Geräte und Werkstätten aus einer XLSX-Datei übernehmen</span></div>
    <div style="background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:900px">
      <div class="section-lbl">Datei wählen</div>
      <input type="file" id="imp-file" accept=".xlsx,.xls" class="fi" style="height:auto;padding:8px" onchange="impLoad(this)">
      <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6">
        Erwartet wird ein Blatt <b>Reparaturen</b> mit den Spalten Kennzeichen, Gerät, Kategorie, Datum, Art,
        Beschreibung, Werkstatt, Kosten, Rechnungs-Nr., Beleg-Nr. Ein Blatt <b>Werkstätten</b> wird, falls vorhanden,
        ebenfalls übernommen. Bereits importierte Zeilen werden anhand der Beleg-Nr. erkannt und übersprungen.
      </div>
      <div id="imp-result" style="margin-top:16px"></div>
    </div>`;
  if(impStats) renderImpPreview();
}

function impLoad(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const shR=wb.Sheets['Reparaturen']||wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(shR,{defval:''});
      const shW=wb.Sheets['Werkstätten']||wb.Sheets['Werkstaetten'];
      const wrows=shW?XLSX.utils.sheet_to_json(shW,{defval:''}):[];
      impPrepare(rows,wrows);
    }catch(err){
      document.getElementById('imp-result').innerHTML=`<div style="color:var(--red-warn);font-size:13px">Datei konnte nicht gelesen werden: ${esc(err.message)}</div>`;
    }
  };
  rd.readAsArrayBuffer(f);
}

function impPrepare(rows,wrows){
  const belegVorhanden=new Set(Object.values(reparaturen).filter(r=>r&&r.beleg).map(r=>String(r.beleg)));
  const kzIndex={}; const nameIndex={};
  Object.entries(geraete).forEach(([k,v])=>{
    if(!v)return;
    if(v.kz) kzIndex[normKz(v.kz)]=k;
    if(v.name) nameIndex[String(v.name).toLowerCase().trim()]=k;
  });
  const neueGeraete={}, neueKats=new Set(), neueWerk=new Set();
  const eintraege=[]; let skip=0, fehler=0;

  rows.forEach(r=>{
    const kz=String(col(r,['kennzeichen'])||'').trim();
    const bez=String(col(r,['gerät','geraet'])||'').trim();
    const beschr=String(col(r,['beschreibung'])||'').trim();
    if(!beschr&&!kz){return;}
    const beleg=String(col(r,['beleg-nr.','beleg-nr','beleg'])||'').trim();
    if(beleg&&belegVorhanden.has(beleg)){skip++;return;}
    const kat=String(col(r,['kategorie'])||'').trim();
    const datum=impDate(col(r,['datum']));
    const art=mapArt(col(r,['art']));
    const firma=String(col(r,['werkstatt'])||'').trim();
    const preis=impPreis(col(r,['kosten (netto)','kosten']));
    const rgnr=String(col(r,['rechnungs-nr.','rechnungs-nr','rechnungsnr'])||'').trim();
    const kred=String(col(r,['kreditor-nr.','kreditor-nr','kreditor'])||'').trim();

    let gid=kz?kzIndex[normKz(kz)]:null, gidQ='exakt';
    if(!gid&&bez){gid=nameIndex[bez.toLowerCase()];if(gid)gidQ='Name';}
    if(!gid&&kz){
      // Toleranter Vergleich: HSK-RH 750 <-> RH-750 <-> RH750
      const n=normKz(kz);
      const hit=Object.keys(kzIndex).find(k=>k.length>=5&&(n.endsWith(k)||k.endsWith(n)));
      if(hit){gid=kzIndex[hit];gidQ='ähnlich';}
    }
    if(!gid&&kz){
      // Gerätename enthält das Kennzeichen
      const n=normKz(kz);
      const hit=Object.entries(geraete).find(([k,v])=>v&&v.name&&normKz(v.name).includes(n)&&n.length>=5);
      if(hit){gid=hit[0];gidQ='Name enthält Kz';}
    }
    if(!gid){
      gidQ='NEU';
      const nk=kz?('NEU_'+normKz(kz)):('NEU_'+bez.toLowerCase());
      if(!neueGeraete[nk]) neueGeraete[nk]={name:bez||kz,kz,kategorie:kat};
      gid=nk;
      if(kat) neueKats.add(kat);
    }
    if(firma) neueWerk.add(firma);
    eintraege.push({gid,gidQ,kz,geraetLabel:bez||kz,datum,art,beschr,rgnr,preis,firma,beleg,kred});
  });

  // Kategorien, die es schon gibt, rausfiltern
  const katVorhanden=new Set(Object.values(kats).filter(k=>k&&k.name).map(k=>k.name.toLowerCase()));
  const katNeu=[...neueKats].filter(k=>!katVorhanden.has(k.toLowerCase()));
  const werkVorhanden=new Set(Object.values(werkstaetten).filter(w=>w&&w.name).map(w=>w.name.toLowerCase()));
  const werkNeu=[...neueWerk].filter(w=>!werkVorhanden.has(w.toLowerCase()));

  impRows={eintraege,neueGeraete,katNeu,werkNeu,wrows};
  impStats={anz:eintraege.length,skip,fehler,ger:Object.keys(neueGeraete).length,kat:katNeu.length,werk:werkNeu.length};
  renderImpPreview();
}

function renderImpPreview(){
  const {eintraege,neueGeraete,katNeu,werkNeu}=impRows;
  const summe=eintraege.reduce((a,e)=>a+(parseFloat(String(e.preis).replace(',','.'))||0),0);
  const zmap={};
  eintraege.forEach(e=>{
    const key=e.kz||e.geraetLabel;
    if(!zmap[key]) zmap[key]={kz:e.kz,q:e.gidQ,n:0,
      ziel:(e.gidQ==='NEU'?(neueGeraete[e.gid]?.name||e.geraetLabel):(geraete[e.gid]?.name||'?'))};
    zmap[key].n++;
  });
  const zuord=Object.values(zmap).sort((a,b)=>b.n-a.n);
  document.getElementById('imp-result').innerHTML=`
    <div class="divider"></div>
    <div class="section-lbl">Vorschau</div>
    <table class="tbl" style="margin-bottom:14px">
      <tr><td>Reparatur-Einträge zum Import</td><td style="text-align:right;font-weight:700">${eintraege.length}</td></tr>
      <tr><td>Summe Kosten</td><td style="text-align:right;font-weight:700;font-family:'IBM Plex Mono',monospace">${summe.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})} €</td></tr>
      <tr><td>Übersprungen (Beleg-Nr. bereits vorhanden)</td><td style="text-align:right">${impStats.skip}</td></tr>
      <tr><td>Geräte werden neu angelegt</td><td style="text-align:right">${katNeu.length?'':''}${Object.keys(neueGeraete).length}</td></tr>
      <tr><td>Kategorien werden neu angelegt</td><td style="text-align:right">${katNeu.length}</td></tr>
      <tr><td>Werkstätten werden neu angelegt</td><td style="text-align:right">${werkNeu.length}</td></tr>
    </table>
    ${katNeu.length?`<div style="font-size:11px;color:var(--slate);margin-bottom:14px"><b>Neue Kategorien:</b> ${katNeu.map(esc).join(', ')}</div>`:''}
    <div class="section-lbl">Zuordnung prüfen</div>
    <div style="max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:14px">
    <table class="tbl"><thead><tr><th>Kennzeichen aus Datei</th><th>Ziel-Gerät</th><th>Treffer</th><th style="text-align:right">Einträge</th></tr></thead><tbody>
    ${zuord.map(z=>`<tr>
      <td style="font-family:'IBM Plex Mono',monospace">${esc(z.kz||'–')}</td>
      <td>${esc(z.ziel)}</td>
      <td><span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;background:${z.q==='NEU'?'var(--purple-l,#f3e8ff)':(z.q==='exakt'?'var(--green-l)':'var(--amber-l)')};color:${z.q==='NEU'?'#7e22ce':(z.q==='exakt'?'var(--green)':'var(--amber)')}">${z.q==='NEU'?'wird neu angelegt':z.q}</span></td>
      <td style="text-align:right">${z.n}</td></tr>`).join('')}
    </tbody></table></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-p" onclick="impRun()">Importieren</button>
      <button class="btn btn-g" onclick="impRows=null;impStats=null;drawImport()">Abbrechen</button>
      <span id="imp-prog" style="font-size:12px;color:var(--muted)"></span>
    </div>`;
}

function impRun(){
  if(!impRows||!impRows.eintraege.length){alert('Nichts zu importieren.');return;}
  const {eintraege,neueGeraete,katNeu,werkNeu}=impRows;
  const prog=document.getElementById('imp-prog');
  const upG={},upK={},upW={},upR={};
  const idMap={};

  // Kategorien
  katNeu.forEach((n,i)=>{
    const k=KR?KR.push().key:('k_'+Date.now()+'_'+i);
    const e={name:n,color:['blue','green','amber','purple','red'][i%5]};
    upK[k]=e; kats[k]=e;
  });
  // Geräte
  Object.entries(neueGeraete).forEach(([tmp,g],i)=>{
    const k=GR?GR.push().key:('g_'+Date.now()+'_'+i);
    const e={name:g.name,kategorie:g.kategorie||'',kz:g.kz||'',sn:'',ort:'',datum:'',bst:'',hu:'',sp:'',pruefName:'',pruefDate:'',notiz:'Angelegt per Excel-Import',ts:Date.now()};
    upG[k]=e; geraete[k]=e; idMap[tmp]=k;
  });
  // Werkstätten
  werkNeu.forEach((n,i)=>{
    const k=WR?WR.push().key:('w_'+Date.now()+'_'+i);
    const e={name:n,kat:'',ts:Date.now()};
    upW[k]=e; werkstaetten[k]=e;
  });
  // Reparaturen
  eintraege.forEach((r,i)=>{
    const gid=idMap[r.gid]||r.gid;
    const k=RR?RR.push().key:('r_'+Date.now()+'_'+i);
    const e={geraetId:gid,datum:r.datum,art:r.art,beschr:r.beschr,rgnr:r.rgnr,preis:r.preis,
             firma:r.firma,notiz:r.kred?('Import Konto 6294 · Kreditor '+r.kred):'Import Konto 6294',
             beleg:r.beleg,pdfUrl:'',pdfName:'',ts:Date.now()};
    upR[k]=e; reparaturen[k]=e;
  });

  const jobs=[];
  if(KR&&katNeu.length) jobs.push(KR.update(upK));
  if(GR&&Object.keys(upG).length) jobs.push(GR.update(upG));
  if(WR&&werkNeu.length) jobs.push(WR.update(upW));
  if(RR&&Object.keys(upR).length) jobs.push(RR.update(upR));
  if(prog) prog.textContent='Übertrage …';

  Promise.all(jobs).then(()=>{
    const n=Object.keys(upR).length;
    impRows=null; impStats=null;
    curTab='all'; goTab('all');
    alert(`Import abgeschlossen.\n\n${n} Reparatur-Einträge, ${Object.keys(upG).length} Geräte, ${werkNeu.length} Werkstätten übernommen.`);
  }).catch(err=>{
    if(prog) prog.textContent='';
    alert('Fehler beim Übertragen: '+err.message);
  });
}

// ── Modal ──
function openM(id){document.getElementById(id).classList.add('on');}
function closeM(id){document.getElementById(id).classList.remove('on');}
document.querySelectorAll('.bd').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)closeM(b.id);}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.bd.on').forEach(b=>closeM(b.id));});

// ── Firebase Init ──
function initFB(){
  if(!db)return;
  try{
    db.ref('.info/connected').on('value',s=>sync(!!s.val()));
    KR.once('value').then(s=>{
      if(!s.val()){
        const b={};DEFAULT_KATS.forEach(k=>{const key=KR.push().key;b[key]=k;});
        KR.update(b);
      }
    }).catch(()=>{});
    KR.on('value',s=>{const v=s.val();if(v){kats=v;}draw();},()=>{});
    GR.on('value',s=>{const v=s.val();if(v){geraete=v;}draw();},()=>{});
    RR.on('value',s=>{reparaturen=s.val()||{};draw();},()=>{});
    WR.on('value',s=>{werkstaetten=s.val()||{};fillWerkSel();},()=>{});
    AR.on('value',s=>{angebote=s.val()||{};draw();},()=>{});
  }catch(e){console.warn(e);}
}

// ── Start ──
DEFAULT_KATS.forEach((k,i)=>{kats['_k'+i]=k;});
draw();
sync(false);
initFB();
</script>
