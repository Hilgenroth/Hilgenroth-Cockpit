<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geräte- & Fahrzeug-Manager | Hilgenroth</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;}
body{font-family:'IBM Plex Sans',sans-serif;background:#F7F8FA;color:#1B1D22;font-size:14px;display:flex;flex-direction:column;}
:root{
  --red:#C8102E;--red-d:#9E0C24;--red-l:#FCE9EC;
  --ink:#1B1D22;--slate:#4A4F58;--muted:#8A909B;
  --line:#E6E8EC;--bg:#F7F8FA;--white:#fff;
  --green:#16a34a;--green-l:#dcfce7;
  --amber:#d97706;--amber-l:#fef3c7;
  --blue:#1d4ed8;--blue-l:#dbeafe;
  --red-warn:#dc2626;
}

/* Nav */
.nav{display:flex;background:var(--white);border-bottom:1px solid var(--line);padding:0 20px;flex-shrink:0;align-items:center;}
.ntab{height:42px;padding:0 14px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;transition:.14s;white-space:nowrap;}
.ntab:hover{color:var(--ink);}
.ntab.on{color:var(--red);border-bottom-color:var(--red);font-weight:600;}
.ntab svg{width:14px;height:14px;stroke-width:1.8;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--amber);}
.sdot.on{background:var(--green);}
.slbl{font-size:11px;color:var(--muted);}

/* Layout */
.wrap{display:flex;flex:1;overflow:hidden;}
.side{width:200px;flex-shrink:0;background:var(--white);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0;}
.side-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 14px 4px;}
.cat-btn{width:100%;text-align:left;padding:7px 14px;background:none;border:none;border-left:3px solid transparent;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--slate);display:flex;align-items:center;justify-content:space-between;transition:.12s;}
.cat-btn:hover{background:var(--bg);color:var(--ink);}
.cat-btn.on{background:var(--red-l);color:var(--red);border-left-color:var(--red);}
.cat-btn .cnt{font-size:10px;font-family:'IBM Plex Mono',monospace;}
.cat-edit{width:20px;height:20px;border:none;background:none;cursor:pointer;color:var(--muted);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:.12s;}
.cat-btn:hover .cat-edit{opacity:1;}
.cat-edit:hover{color:var(--red);background:var(--red-l);}
.cat-edit svg{width:11px;height:11px;stroke-width:2;}
.add-cat{width:100%;text-align:left;padding:7px 14px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-family:'IBM Plex Sans',sans-serif;transition:.12s;}
.add-cat:hover{color:var(--red);}

/* Main */
.main{flex:1;overflow-y:auto;padding:18px 22px;}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.pht{font-size:16px;font-weight:600;}
.ph-r{display:flex;gap:8px;align-items:center;}

/* Buttons */
.btn{height:30px;padding:0 13px;border-radius:6px;font-size:12px;font-weight:500;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:.14s;white-space:nowrap;}
.btn-p{background:var(--red);color:#fff;}.btn-p:hover{background:var(--red-d);}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--slate);}.btn-g:hover{border-color:var(--muted);color:var(--ink);}
.btn-sm{height:26px;padding:0 9px;font-size:11px;border-radius:4px;}

/* Suche */
.swrap{position:relative;}
.swrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);stroke-width:2;pointer-events:none;}
.sinp{height:30px;padding:0 10px 0 30px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--ink);background:var(--white);width:200px;}
.sinp:focus{outline:none;border-color:var(--red);}

/* Karten-Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;transition:.14s;cursor:pointer;}
.card:hover{border-color:var(--red);box-shadow:0 2px 10px rgba(200,16,46,.08);}
.card.warn{border-left:4px solid var(--amber);}
.card.overdue{border-left:4px solid var(--red-warn);}
.card-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px;}
.card-name{font-size:14px;font-weight:700;color:var(--ink);}
.card-nr{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
.card-kat{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--blue-l);color:var(--blue);}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
.card-field{font-size:11px;}
.card-field .lbl{color:var(--muted);margin-bottom:1px;}
.card-field .val{font-weight:500;color:var(--ink);}
.card-field .val.warn{color:var(--amber);font-weight:600;}
.card-field .val.ok{color:var(--green);}
.card-field .val.over{color:var(--red-warn);font-weight:600;}
.card-actions{display:flex;gap:4px;margin-top:12px;justify-content:flex-end;}
.ib{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ib svg{width:13px;height:13px;stroke-width:1.8;}
.ib.e:hover{border-color:var(--red);color:var(--red);}
.ib.d:hover{border-color:#ef4444;color:#ef4444;}

/* Status-Badges */
.status-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.sbadge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:3px;}
.sbadge svg{width:10px;height:10px;stroke-width:2.5;}
.sbadge.ok{background:var(--green-l);color:var(--green);}
.sbadge.warn{background:var(--amber-l);color:var(--amber);}
.sbadge.over{background:#fee2e2;color:var(--red-warn);}

/* Tabellen-Ansicht */
.twrap{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{background:var(--bg);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg);}
.ra{display:flex;gap:3px;opacity:0;transition:.12s;}
tr:hover .ra{opacity:1;}

/* Modal */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:200;}
.bd.on{display:flex;}
.md{background:var(--white);border-radius:10px;padding:24px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.14);}
.mdt{font-size:15px;font-weight:600;margin-bottom:18px;}
.fr{margin-bottom:12px;}
.fr label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);display:block;margin-bottom:4px;}
.fi,.fs{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--white);}
.fi:focus,.fs:focus{outline:none;border-color:var(--red);}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.ma{display:flex;gap:7px;justify-content:flex-end;margin-top:18px;}
.divider{height:1px;background:var(--line);margin:16px 0;}
.section-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;}

.empty{padding:40px;text-align:center;color:var(--muted);}
.rep-timeline{display:flex;flex-direction:column;gap:0;}
.rep-entry{display:flex;gap:0;position:relative;}
.rep-line{display:flex;flex-direction:column;align-items:center;width:36px;flex-shrink:0;}
.rep-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--white);flex-shrink:0;margin-top:4px;z-index:1;}
.rep-dot.Reparatur{background:var(--amber);}
.rep-dot.Wartung{background:var(--green);}
.rep-dot.Unfall{background:var(--red-warn);}
.rep-dot.TÜV{background:var(--blue);}
.rep-dot.Neukauf{background:#7c3aed;}
.rep-dot.Sonstiges{background:var(--muted);}
.rep-vline{width:2px;background:var(--line);flex:1;margin-top:0;}
.rep-content{flex:1;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;margin-left:8px;}
.rep-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;}
.rep-art{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;}
.rep-art.Reparatur{background:var(--amber-l);color:var(--amber);}
.rep-art.Wartung{background:var(--green-l);color:var(--green);}
.rep-art.Unfall{background:#fee2e2;color:var(--red-warn);}
.rep-art.TÜV{background:var(--blue-l);color:var(--blue);}
.rep-art.Neukauf{background:#ede9fe;color:#7c3aed;}
.rep-art.Sonstiges{background:var(--line);color:var(--slate);}
.rep-preis{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;color:var(--red-warn);}
.rep-beschr{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.rep-meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;}
.back-btn{display:flex;align-items:center;gap:7px;margin-bottom:16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--slate);}
.back-btn:hover{color:var(--red);}
.back-btn svg{width:15px;height:15px;stroke-width:2;}
.detail-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:18px;}
.stat-box{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px 14px;}
.stat-box .s-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px;}
.stat-box .s-val{font-size:15px;font-weight:700;color:var(--ink);}
.stat-box .s-val.red{color:var(--red-warn);}
.empty svg{width:36px;height:36px;stroke:var(--muted);margin:0 auto 10px;display:block;opacity:.3;}
.view-toggle{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.vt-btn{height:28px;width:30px;border:none;background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.12s;}
.vt-btn.on{background:var(--red);color:#fff;}
.vt-btn svg{width:14px;height:14px;stroke-width:1.8;}
</style>
</head>
<body>

<div class="nav">
  <button class="ntab on" id="nt-all" onclick="goTab('all')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Alle Geräte
  </button>
  <button class="ntab" id="nt-due" onclick="goTab('due')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Fällige Prüfungen
  </button>
  <div class="nav-right">
    <span class="sdot" id="sdot"></span><span class="slbl" id="slbl">verbinde …</span>
  </div>
</div>

<div class="wrap">
  <aside class="side">
    <div class="side-lbl">Kategorien</div>
    <button class="cat-btn on" id="cb-alle" onclick="setCat(null,this)">
      <span>Alle</span><span class="cnt" id="cnt-alle"></span>
    </button>
    <div id="cat-list"></div>
    <button class="add-cat" onclick="openCatModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="13" height="13" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Kategorie hinzufügen
    </button>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- Gerät Modal -->
<div class="bd" id="bd-geraet">
  <div class="md">
    <div class="mdt" id="g-title">Neues Gerät / Fahrzeug</div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>Bezeichnung *</label><input class="fi" id="g-name" placeholder="z.B. Bagger Liebherr"></div>
      <div class="fr" style="margin:0"><label>Kategorie</label><select class="fs" id="g-kat" onchange="updateBstLabel()"></select></div>
    </div>
    <div class="fr2" style="margin-top:12px">
      <div class="fr" style="margin:0"><label>Kennzeichen</label><input class="fi" id="g-kz" placeholder="z.B. SO-HI 123"></div>
      <div class="fr" style="margin:0"><label>Seriennummer</label><input class="fi" id="g-sn" placeholder="z.B. SN-2024-001"></div>
    </div>
    <div class="fr" style="margin-top:12px"><label>Standort / Ort</label><input class="fi" id="g-ort" placeholder="z.B. Hellefeld, Bauhof"></div>
    <div class="divider"></div>
    <div class="section-lbl">Anschaffung & Betrieb</div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>Anschaffungsdatum</label><input class="fi" type="date" id="g-datum"></div>
      <div class="fr" style="margin:0"><label id="g-bst-lbl">Betriebsstunden / km</label><input class="fi" id="g-bst" placeholder="z.B. 4500" type="number"></div>
    </div>
    <div class="divider"></div>
    <div class="section-lbl">TÜV / Prüftermine</div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>HU fällig am</label><input class="fi" type="date" id="g-hu"></div>
      <div class="fr" style="margin:0"><label>SP fällig am</label><input class="fi" type="date" id="g-sp"></div>
    </div>
    <div class="fr" style="margin-top:12px"><label>Weitere Prüfung (z.B. UVV)</label>
      <div class="fr2" style="gap:6px">
        <input class="fi" id="g-pruef-name" placeholder="Bezeichnung z.B. UVV">
        <input class="fi" type="date" id="g-pruef-date">
      </div>
    </div>
    <div class="divider"></div>
    <div class="fr"><label>Notiz</label><input class="fi" id="g-notiz" placeholder="z.B. Ölwechsel fällig, Defekte …"></div>
    <div class="ma">
      <button class="btn btn-g" onclick="closeM('bd-geraet')">Abbrechen</button>
      <button class="btn btn-p" onclick="saveGeraet()">Speichern</button>
    </div>
  </div>
</div>

<!-- Reparatur Modal -->
<div class="bd" id="bd-rep">
  <div class="md" style="width:480px">
    <div class="mdt" id="rep-title">Reparatur / Ereignis erfassen</div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>Datum *</label><input class="fi" type="date" id="rep-datum"></div>
      <div class="fr" style="margin:0"><label>Art</label>
        <select class="fs" id="rep-art">
          <option value="Reparatur">Reparatur</option>
          <option value="Neukauf/Ersatz">Neukauf / Ersatz</option>
          <option value="Wartung">Wartung</option>
          <option value="Unfall/Schaden">Unfall / Schaden</option>
          <option value="TÜV/Prüfung">TÜV / Prüfung</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
      </div>
    </div>
    <div class="fr" style="margin-top:11px"><label>Beschreibung / Schaden *</label>
      <input class="fi" id="rep-beschr" placeholder="z.B. Hydraulikschlauch gerissen, Ölwechsel …">
    </div>
    <div class="fr2">
      <div class="fr" style="margin:0"><label>Rechnungsnummer</label><input class="fi" id="rep-rgnr" placeholder="z.B. RG-2026-0042"></div>
      <div class="fr" style="margin:0"><label>Kosten netto (€)</label><input class="fi" id="rep-preis" placeholder="z.B. 850,00" oninput="cleanRepPreis(this)"></div>
    </div>
    <div class="fr"><label>Werkstatt / Lieferant</label>
      <div style="display:flex;gap:6px">
        <select class="fs" id="rep-firma-sel" onchange="if(this.value)document.getElementById('rep-firma').value=this.value" style="flex:1">
          <option value="">— aus gespeicherten wählen —</option>
        </select>
        <input class="fi" id="rep-firma" placeholder="oder neu eingeben" style="flex:1">
      </div>
    </div>
    <div class="fr"><label>Notiz</label><input class="fi" id="rep-notiz" placeholder="z.B. Garantie bis …"></div>
    <div class="ma">
      <button class="btn btn-g" onclick="closeM('bd-rep')">Abbrechen</button>
      <button class="btn btn-p" onclick="saveRep()">Speichern</button>
    </div>
  </div>
</div>

<!-- Kategorie Modal -->
<div class="bd" id="bd-kat">
  <div class="md" style="width:360px">
    <div class="mdt" id="kat-title">Kategorie</div>
    <div class="fr"><label>Name *</label><input class="fi" id="kat-name" placeholder="z.B. Baumaschinen"></div>
    <div class="fr"><label>Farbe</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="kat-colors">
        <label style="cursor:pointer" title="Blau"><input type="radio" name="kat-color" value="blue" style="display:none"><span style="display:inline-block;width:22px;height:22px;border-radius:4px;background:#dbeafe;border:2px solid #1d4ed8"></span></label>
        <label style="cursor:pointer" title="Grün"><input type="radio" name="kat-color" value="green" style="display:none"><span style="display:inline-block;width:22px;height:22px;border-radius:4px;background:#dcfce7;border:2px solid #16a34a"></span></label>
        <label style="cursor:pointer" title="Amber"><input type="radio" name="kat-color" value="amber" style="display:none"><span style="display:inline-block;width:22px;height:22px;border-radius:4px;background:#fef3c7;border:2px solid #d97706"></span></label>
        <label style="cursor:pointer" title="Rot"><input type="radio" name="kat-color" value="red" style="display:none"><span style="display:inline-block;width:22px;height:22px;border-radius:4px;background:#fee2e2;border:2px solid #dc2626"></span></label>
        <label style="cursor:pointer" title="Lila"><input type="radio" name="kat-color" value="purple" style="display:none"><span style="display:inline-block;width:22px;height:22px;border-radius:4px;background:#ede9fe;border:2px solid #7c3aed"></span></label>
        <label style="cursor:pointer" title="Grau"><input type="radio" name="kat-color" value="gray" style="display:none"><span style="display:inline-block;width:22px;height:22px;border-radius:4px;background:#f1f5f9;border:2px solid #64748b"></span></label>
      </div>
    </div>
    <div class="ma">
      <button class="btn btn-g" onclick="closeM('bd-kat')">Abbrechen</button>
      <button class="btn btn-p" onclick="saveKat()">Speichern</button>
      <button class="btn btn-g" id="del-kat-btn" style="display:none;color:#ef4444" onclick="delKat()">Löschen</button>
    </div>
  </div>
</div>

<script>
// ── Firebase (Dispo-Hellefeld) ──
let db=null, GR=null, KR=null, RR=null, WR=null;
try {
  if(typeof firebase !== 'undefined'){
    firebase.initializeApp({
      apiKey:"AIzaSyAuU6mF5p5JQ5qvwLVbYUGc1v-HoQ8ZUMw",
      authDomain:"dispo-hellefeld.firebaseapp.com",
      databaseURL:"https://dispo-hellefeld-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:"dispo-hellefeld",
      storageBucket:"dispo-hellefeld.firebasestorage.app",
      messagingSenderId:"34994251645",
      appId:"1:34994251645:web:2f8a076d385bb245354e14"
    });
    db = firebase.database();
    GR = db.ref('geraete/items');
    KR = db.ref('geraete/kategorien');
    RR = db.ref('geraete/reparaturen');
    WR = db.ref('geraete/werkstaetten');
  }
} catch(e){ console.warn('Firebase:', e.message); }

// ── State ──
let geraete={}, kats={}, reparaturen={}, werkstaetten={};
let curKat=null, curTab='all', curGeraetDetail=null, geraetKey=null, katKey=null, repKey=null, wsKey=null, viewMode='grid', sq='';

// ── Farben ──
const COLORS={
  blue:{bg:'#dbeafe',col:'#1d4ed8'},
  green:{bg:'#dcfce7',col:'#16a34a'},
  amber:{bg:'#fef3c7',col:'#d97706'},
  red:{bg:'#fee2e2',col:'#dc2626'},

// ── Helpers ──
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sync(on){document.getElementById('sdot').className='sdot'+(on?' on':'');document.getElementById('slbl').textContent=on?'synchronisiert':'offline';}

// ── Datum-Helpers ──
function daysUntil(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr), now=new Date();
  now.setHours(0,0,0,0);
  return Math.round((d-now)/(1000*60*60*24));
}
function fmtDate(d){if(!d)return'–';const p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function statusClass(days){
  if(days===null)return'';
  if(days<0)return'over';
  if(days<=30)return'warn';
  return'ok';
}
function statusLabel(days){
  if(days===null)return'–';
  if(days<0)return`${Math.abs(days)} Tage überfällig`;
  if(days===0)return'Heute fällig!';
  if(days<=30)return`in ${days} Tagen`;
  return fmtDate;
}

}

// ── Fällige Prüfungen ──
function drawDue(){
  const main=document.getElementById('main');
  const WARN_DAYS=60;
  let items=Object.entries(geraete).filter(([k,v])=>{
    if(!v||!v.name)return false;
    const hu=daysUntil(v.hu), sp=daysUntil(v.sp), pp=daysUntil(v.pruefDate);
    return (hu!==null&&hu<=WARN_DAYS)||(sp!==null&&sp<=WARN_DAYS)||(pp!==null&&pp<=WARN_DAYS);
  });
  items.sort((a,b)=>{
    const minA=Math.min(...[a[1].hu,a[1].sp,a[1].pruefDate].map(d=>daysUntil(d)??999));
    const minB=Math.min(...[b[1].hu,b[1].sp,b[1].pruefDate].map(d=>daysUntil(d)??999));
    return minA-minB;
  });
  let html=`<div class="ph"><div class="pht">Fällige Prüfungen <span style="font-size:13px;color:var(--muted);font-weight:400">(nächste 60 Tage)</span></div><span style="font-size:12px;color:var(--muted)">${items.length} Geräte</span></div>`;
  if(!items.length){
    html+=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg><p>Keine fälligen Prüfungen in den nächsten 60 Tagen</p></div>`;
  } else {
    html+=`<div class="grid">`;
    items.forEach(([k,v])=>{ html+=buildCard(k,v,true); });
    html+=`</div>`;
  }
  main.innerHTML=html;
}

// ── Karte bauen ──
function buildCard(k,v,fälligOnly=false){
  const hu=daysUntil(v.hu), sp=daysUntil(v.sp), pp=daysUntil(v.pruefDate);
  const minDays=Math.min(...[hu,sp,pp].filter(d=>d!==null));
  const isWarn=minDays!==null&&minDays<=30&&minDays>=0;
  const isOver=minDays!==null&&minDays<0;
  const kat=Object.values(kats).find(c=>c&&c.name===v.kategorie);
  const col=kat?COLORS[kat.color||'blue']:COLORS.blue;

  const statusBadge=(days,label)=>{
    if(days===null)return'';
    const sc=statusClass(days);
    const txt=days<0?`${Math.abs(days)}d überfällig`:days===0?'Heute!':days<=30?`${days}d`:fmtDate(days<0?'':v.hu||v.sp||'');
    return `<span class="sbadge ${sc}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ${label}: ${days<0?`${Math.abs(days)}d überfällig`:days===0?'Heute!':days<=30?`in ${days}d`:'OK'}
    </span>`;
  };

  return `<div class="card${isOver?' overdue':isWarn?' warn':''}" onclick="showDetail('${k}')">
    <div class="card-head">
      <div>
        <div class="card-name">${esc(v.name)}</div>
        ${v.kz?`<div class="card-nr">${esc(v.kz)}</div>`:''}
        ${v.sn?`<div class="card-nr" style="color:var(--muted)">SN: ${esc(v.sn)}</div>`:''}
      </div>
      <span class="card-kat" style="background:${col.bg};color:${col.col}">${esc(v.kategorie||'–')}</span>
    </div>
    <div class="card-body">
      ${v.ort?`<div class="card-field"><div class="lbl">Standort</div><div class="val">${esc(v.ort)}</div></div>`:''}
      ${v.bst?`<div class="card-field"><div class="lbl">${['Fahrzeuge','Anhänger'].includes(v.kategorie)?'Kilometerstand':'Betriebsstunden'}</div><div class="val">${esc(v.bst)} ${['Fahrzeuge','Anhänger'].includes(v.kategorie)?'km':'h'}</div></div>`:''}
      ${v.datum?`<div class="card-field"><div class="lbl">Anschaffung</div><div class="val">${fmtDate(v.datum)}</div></div>`:''}
      ${v.hu?`<div class="card-field"><div class="lbl">HU fällig</div><div class="val ${statusClass(hu)}">${fmtDate(v.hu)}</div></div>`:''}
      ${v.sp?`<div class="card-field"><div class="lbl">SP fällig</div><div class="val ${statusClass(sp)}">${fmtDate(v.sp)}</div></div>`:''}
      ${v.pruefName&&v.pruefDate?`<div class="card-field"><div class="lbl">${esc(v.pruefName)}</div><div class="val ${statusClass(pp)}">${fmtDate(v.pruefDate)}</div></div>`:''}
    </div>
    ${(hu!==null&&hu<=60)||(sp!==null&&sp<=60)||(pp!==null&&pp<=60)?`<div class="status-row">
      ${hu!==null&&hu<=60?statusBadge(hu,'HU'):''}
      ${sp!==null&&sp<=60?statusBadge(sp,'SP'):''}
      ${pp!==null&&pp<=60?statusBadge(pp,v.pruefName||'Prüfung'):''}
    </div>`:''}
    ${v.notiz?`<div style="font-size:11px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:6px">${esc(v.notiz)}</div>`:''}
    <div class="card-actions">
      <button class="ib e" onclick="event.stopPropagation();openGeraet('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
      <button class="ib d" onclick="event.stopPropagation();delGeraet('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>
  </div>`;
}

// ── Reparatur CRUD ──
function fillWerkSel(){
  const sel=document.getElementById('rep-firma-sel');
  if(!sel)return;
  const cur=sel.value;
  const names=[...new Set(Object.values(werkstaetten).filter(w=>w&&w.name).map(w=>w.name))].sort();
  sel.innerHTML='<option value="">— aus gespeicherten wählen —</option>'+
    names.map(n=>`<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('');
}

function saveWerkstatt(name){
  if(!name||Object.values(werkstaetten).find(w=>w&&w.name===name))return;
  const k=WR?WR.push().key:'w_'+Date.now();
  const e={name,ts:Date.now()};
  if(WR)WR.child(k).set(e);
  werkstaetten[k]=e;
  fillWerkSel();
}

function openRep(geraetId){
  repKey=null;
  document.getElementById('rep-title').textContent='Reparatur / Ereignis erfassen';
  document.getElementById('rep-datum').value=new Date().toISOString().slice(0,10);
  ['rep-beschr','rep-rgnr','rep-preis','rep-firma','rep-notiz'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('rep-art').value='Reparatur';
  document.getElementById('bd-rep').dataset.geraetId=geraetId;
  fillWerkSel();
  openM('bd-rep');
}
function cleanRepPreis(inp){
  let v=inp.value.replace(/[^0-9,\.]/g,'');
  const f=v.search(/[,.]/);
  if(f>=0)v=v.slice(0,f+1)+v.slice(f+1).replace(/[,.]/g,'');
  inp.value=v;
}
function saveRep(){
  const beschr=document.getElementById('rep-beschr').value.trim();
  if(!beschr){alert('Beschreibung ist Pflichtfeld.');return;}
  const geraetId=document.getElementById('bd-rep').dataset.geraetId;
  const e={
    geraetId,
    datum:document.getElementById('rep-datum').value,
    art:document.getElementById('rep-art').value,
    beschr,
    rgnr:document.getElementById('rep-rgnr').value.trim(),
    preis:document.getElementById('rep-preis').value.trim(),
    firma:(document.getElementById('rep-firma').value.trim()||document.getElementById('rep-firma-sel').value),
    notiz:document.getElementById('rep-notiz').value.trim(),
    ts:Date.now()
  };
  const rk=RR?RR.push().key:'r_'+Date.now();
  if(RR)RR.child(rk).set(e);
  reparaturen[rk]=e;
  // Werkstatt automatisch speichern
  if(e.firma) saveWerkstatt(e.firma);
  closeM('bd-rep');
  curGeraetDetail=geraetId;
  curTab='detail';
  draw();
}
function delRep(rk){
  if(!confirm('Eintrag löschen?'))return;
  if(RR)RR.child(rk).remove();
  delete reparaturen[rk];
  draw();
}

// ── Gerät CRUD ──
function updateBstLabel(){
  const kat=document.getElementById('g-kat')?.value||'';
  const lbl=document.getElementById('g-bst-lbl');
  const inp=document.getElementById('g-bst');
  if(!lbl||!inp)return;
  const isKm=['Fahrzeuge','Anhänger'].includes(kat);
  lbl.textContent=isKm?'Kilometerstand':'Betriebsstunden';
  inp.placeholder=isKm?'z.B. 125000':'z.B. 4500';
}

function openGeraet(key){
  geraetKey=key||null;
  document.getElementById('g-title').textContent=key?'Gerät bearbeiten':'Neues Gerät / Fahrzeug';
  fillKatSel();
  updateBstLabel();
  if(key&&geraete[key]){
    const v=geraete[key];
    document.getElementById('g-name').value=v.name||'';
    document.getElementById('g-kat').value=v.kategorie||'';
    updateBstLabel();
    document.getElementById('g-kz').value=v.kz||'';
    document.getElementById('g-sn').value=v.sn||'';
    document.getElementById('g-ort').value=v.ort||'';
    document.getElementById('g-datum').value=v.datum||'';
    document.getElementById('g-bst').value=v.bst||'';
    document.getElementById('g-hu').value=v.hu||'';
    document.getElementById('g-sp').value=v.sp||'';
    document.getElementById('g-pruef-name').value=v.pruefName||'';
    document.getElementById('g-pruef-date').value=v.pruefDate||'';
    document.getElementById('g-notiz').value=v.notiz||'';
  } else {
    ['g-name','g-kz','g-sn','g-ort','g-datum','g-bst','g-hu','g-sp','g-pruef-name','g-pruef-date','g-notiz'].forEach(id=>document.getElementById(id).value='');
    if(curKat) document.getElementById('g-kat').value=curKat;
  }
  openM('bd-geraet');
}
function saveGeraet(){
  const name=document.getElementById('g-name').value.trim();
  if(!name){alert('Bezeichnung ist Pflichtfeld.');return;}
  const e={
    name, kategorie:document.getElementById('g-kat').value,
    kz:document.getElementById('g-kz').value.trim(),
    sn:document.getElementById('g-sn').value.trim(),
    ort:document.getElementById('g-ort').value.trim(),
    datum:document.getElementById('g-datum').value,
    bst:document.getElementById('g-bst').value.trim(),
    hu:document.getElementById('g-hu').value,
    sp:document.getElementById('g-sp').value,
    pruefName:document.getElementById('g-pruef-name').value.trim(),
    pruefDate:document.getElementById('g-pruef-date').value,
    notiz:document.getElementById('g-notiz').value.trim(),
    ts:Date.now()
  };
  if(geraetKey){GR&&GR.child(geraetKey).update(e);geraete[geraetKey]={...geraete[geraetKey],...e};}
  else{const k=GR?GR.push().key:'_'+Date.now();GR&&GR.child(k).set(e);geraete[k]=e;}
  closeM('bd-geraet');draw();
}
function delGeraet(k){
  if(!confirm(`"${geraete[k]?.name}" wirklich löschen?`))return;
  GR&&GR.child(k).remove();delete geraete[k];draw();
}

// ── Kategorie CRUD ──
function openCatModal(key){
  katKey=key||null;
  document.getElementById('kat-title').textContent=key?'Kategorie bearbeiten':'Neue Kategorie';
  document.getElementById('del-kat-btn').style.display=key?'':'none';
  if(key&&kats[key]){
    document.getElementById('kat-name').value=kats[key].name||'';
    const col=kats[key].color||'blue';
    const radio=document.querySelector(`input[name="kat-color"][value="${col}"]`);
    if(radio)radio.checked=true;
  } else {
    document.getElementById('kat-name').value='';
    const first=document.querySelector('input[name="kat-color"]');
    if(first)first.checked=true;
  }
  openM('bd-kat');
}
function saveKat(){
  const name=document.getElementById('kat-name').value.trim();
  if(!name){alert('Name ist Pflichtfeld.');return;}
  const color=document.querySelector('input[name="kat-color"]:checked')?.value||'blue';
  const e={name,color};
  if(katKey){KR&&KR.child(katKey).update(e);kats[katKey]={...kats[katKey],...e};}
  else{const k=KR?KR.push().key:'k_'+Date.now();KR&&KR.child(k).set(e);kats[k]=e;}
  closeM('bd-kat');draw();
}
function delKat(){
  if(!katKey)return;
  const name=kats[katKey]?.name;
  const cnt=Object.values(geraete).filter(g=>g&&g.kategorie===name).length;
  if(cnt>0){alert(`Diese Kategorie enthält noch ${cnt} Gerät(e). Bitte zuerst umkategorisieren.`);return;}
  if(!confirm(`Kategorie "${name}" löschen?`))return;
  KR&&KR.child(katKey).remove();delete kats[katKey];
  closeM('bd-kat');draw();
}

// ── Modal ──
function openM(id){document.getElementById(id).classList.add('on');}
function closeM(id){document.getElementById(id).classList.remove('on');}
document.querySelectorAll('.bd').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)closeM(b.id);}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.bd.on').forEach(b=>closeM(b.id));});

// ── Firebase Init ──
function initFB(){
  if(!db)return;
  try{
    db.ref('.info/connected').on('value',s=>sync(!!s.val()));
    KR.once('value').then(s=>{
      if(!s.val()){
        const b={};DEFAULT_KATS.forEach(k=>{const key=KR.push().key;b[key]=k;});
        KR.update(b);
      }
    }).catch(()=>{});
    KR.on('value',s=>{const v=s.val();if(v){kats=v;}draw();},()=>{});
    GR.on('value',s=>{const v=s.val();if(v){geraete=v;}draw();},()=>{});
    RR.on('value',s=>{reparaturen=s.val()||{};draw();},()=>{});
    WR.on('value',s=>{werkstaetten=s.val()||{};fillWerkSel();},()=>{});
  }catch(e){console.warn(e);}
}

// ── Start ──
DEFAULT_KATS.forEach((k,i)=>{kats['_k'+i]=k;});
draw();
sync(false);
initFB();
</script>
</body>
