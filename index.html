<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hilgenroth · Cockpit</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C8102E;--red-dark:#9E0C24;--red-light:#FCE9EC;
  --ink:#1B1D22;--slate:#4A4F58;--muted:#8A909B;
  --line:#E6E8EC;--line-soft:#F0F1F4;--bg:#F7F8FA;--white:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(20,24,31,.05),0 1px 3px rgba(20,24,31,.06);
  --shadow-md:0 4px 14px rgba(20,24,31,.08),0 2px 6px rgba(20,24,31,.05);
}
html,body{height:100%;overflow:hidden;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

.header{background:var(--white);border-bottom:1px solid var(--line);flex-shrink:0;z-index:30;box-shadow:var(--shadow-sm);}
.header-top{height:64px;display:flex;align-items:center;padding:0 24px;gap:22px;}
.brand{display:flex;align-items:center;flex-shrink:0;}
.brand-logo{height:42px;width:auto;display:block;transition:opacity .25s;}
.brand-logo.fade{opacity:0;}

.company-switch{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;}
.company-btn{
  height:36px;padding:0 20px;border:none;background:transparent;border-radius:7px;
  font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;color:var(--slate);
  cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;
  transition:color .18s,background .18s,box-shadow .18s;
}
.company-btn:hover{color:var(--ink);}
.company-btn.active{background:var(--white);color:var(--red);font-weight:600;box-shadow:var(--shadow-sm);}
.company-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .18s,transform .18s;}
.company-btn.active .dot{background:var(--red);transform:scale(1.15);}

.header-right{margin-left:auto;display:flex;align-items:center;gap:16px;flex-shrink:0;}
.clock-wrap{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
.clock{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;color:var(--ink);letter-spacing:.04em;}
.date{font-size:11px;color:var(--muted);}

.tabbar{display:flex;align-items:stretch;padding:0 24px;gap:2px;background:var(--white);min-height:46px;overflow-x:auto;scrollbar-width:none;}
.tabbar::-webkit-scrollbar{display:none;}
.tab{
  display:flex;align-items:center;gap:8px;padding:0 16px;height:46px;
  font-size:13px;font-weight:500;color:var(--slate);background:none;border:none;cursor:pointer;
  font-family:'IBM Plex Sans',sans-serif;white-space:nowrap;position:relative;flex-shrink:0;transition:color .16s;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--red);font-weight:600;}
.tab .tab-underline{position:absolute;left:12px;right:12px;bottom:0;height:2.5px;background:var(--red);border-radius:2px 2px 0 0;transform:scaleX(0);transition:transform .22s cubic-bezier(.4,0,.2,1);}
.tab.active .tab-underline{transform:scaleX(1);}
.tab svg{width:16px;height:16px;flex-shrink:0;stroke-width:1.8;transition:transform .18s;}
.tab:hover svg{transform:translateY(-1px);}
.tab.has-sub .chev{width:13px;height:13px;stroke-width:2;transition:transform .2s;opacity:.6;}
.tab.has-sub.active .chev{transform:rotate(180deg);opacity:1;}

.subbar{display:flex;align-items:stretch;gap:2px;padding:0 24px;background:var(--line-soft);border-bottom:1px solid var(--line);max-height:0;overflow:hidden;transition:max-height .22s ease;}
.subbar.visible{max-height:48px;}
.subtab{
  display:flex;align-items:center;gap:7px;padding:0 14px;height:40px;
  font-size:12.5px;font-weight:500;color:var(--slate);background:none;border:none;cursor:pointer;
  font-family:'IBM Plex Sans',sans-serif;white-space:nowrap;position:relative;flex-shrink:0;transition:color .15s;
}
.subtab:hover{color:var(--ink);}
.subtab.active{color:var(--red);font-weight:600;}
.subtab .sub-underline{position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--red);border-radius:2px 2px 0 0;transform:scaleX(0);transition:transform .2s;}
.subtab.active .sub-underline{transform:scaleX(1);}
.subtab svg{width:14px;height:14px;flex-shrink:0;stroke-width:1.8;}

.stage{flex:1;position:relative;overflow:hidden;background:var(--bg);}
iframe.frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--white);opacity:0;pointer-events:none;transition:opacity .25s;}
iframe.frame.active{opacity:1;pointer-events:auto;}

.loader{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);z-index:5;}
.loader.visible{display:flex;}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;color:var(--muted);font-weight:500;}

.errbox{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:6;padding:24px;}
.errbox.visible{display:flex;}
.errbox .ic{width:56px;height:56px;border-radius:50%;background:var(--red-light);display:flex;align-items:center;justify-content:center;}
.errbox .ic svg{width:26px;height:26px;stroke:var(--red);stroke-width:2;}
.errbox h3{font-size:15px;font-weight:600;color:var(--ink);}
.errbox p{font-size:13px;color:var(--muted);text-align:center;max-width:360px;line-height:1.6;}
.errbox code{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--white);border:1px solid var(--line);padding:3px 8px;border-radius:5px;color:var(--red-dark);}

@keyframes tabPop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.tab{animation:tabPop .28s ease backwards;}

@media(max-width:820px){.company-btn{padding:0 14px;font-size:12px;}.header-right{display:none;}.brand-logo{height:34px;}}

/* ── Login ── */
#login-screen{
  position:fixed;inset:0;background:#F7F8FA;z-index:999;
  display:flex;align-items:center;justify-content:center;
}
.login-box{
  background:#fff;border-radius:12px;padding:36px 40px;
  width:380px;max-width:95vw;
  box-shadow:0 4px 24px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);
  border-top:3px solid #C8102E;
}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.login-logo img{height:36px;}
.login-title{font-size:15px;font-weight:600;color:#1B1D22;margin-bottom:4px;}
.login-sub{font-size:12px;color:#8A909B;}
.lf{margin-bottom:14px;}
.lf label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#4A4F58;display:block;margin-bottom:5px;}
.lf select,.lf input{
  width:100%;height:38px;padding:0 12px;
  border:1px solid #E6E8EC;border-radius:7px;
  font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#1B1D22;
  background:#fff;transition:border-color .14s;
}
.lf select:focus,.lf input:focus{outline:none;border-color:#C8102E;}
.login-btn{
  width:100%;height:40px;background:#C8102E;color:#fff;border:none;
  border-radius:7px;font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;
  transition:background .14s;
}
.login-btn:hover{background:#9E0C24;}
.login-err{font-size:12px;color:#C8102E;margin-top:8px;min-height:18px;text-align:center;}

/* Admin-Modal */
#admin-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;
  display:none;align-items:center;justify-content:center;
}
#admin-modal.on{display:flex;}
.admin-box{
  background:#fff;border-radius:10px;width:680px;max-width:96vw;
  max-height:88vh;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
}
.admin-head{
  padding:18px 22px;border-bottom:1px solid #E6E8EC;
  display:flex;align-items:center;justify-content:space-between;
}
.admin-head h2{font-size:15px;font-weight:600;}
.admin-body{padding:20px 22px;}
.user-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid #F0F1F4;
  flex-wrap:wrap;
}
.user-row:last-child{border-bottom:none;}
.user-name{font-size:13px;font-weight:600;min-width:120px;color:#1B1D22;}
.user-pass{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A909B;min-width:100px;}
.perm-grid{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.perm-pill{
  display:flex;align-items:center;gap:4px;
  font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;
  border:1px solid #E6E8EC;background:#F7F8FA;color:#4A4F58;cursor:pointer;
  transition:.12s;user-select:none;
}
.perm-pill.on{background:#FCE9EC;border-color:#C8102E;color:#C8102E;font-weight:600;}
.user-del{width:26px;height:26px;border-radius:4px;border:1px solid #E6E8EC;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.user-del:hover{border-color:#ef4444;color:#ef4444;}
.user-del svg{width:13px;height:13px;stroke-width:1.8;}
.add-user-form{
  background:#F7F8FA;border-radius:8px;padding:16px;margin-top:16px;
  display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;
}
.add-user-form .lf{margin:0;}
.add-btn{height:34px;padding:0 16px;background:#C8102E;color:#fff;border:none;border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
.add-btn:hover{background:#9E0C24;}

/* Admin-Button im Header */
.admin-gear{
  width:30px;height:30px;border-radius:6px;border:1px solid var(--line);
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:.14s;flex-shrink:0;
}
.admin-gear:hover{background:var(--red-light);color:var(--red);border-color:var(--red);}
.admin-gear svg{width:15px;height:15px;stroke-width:1.8;}
/* Abmelden */
.logout-btn{
  height:26px;padding:0 12px;border-radius:5px;border:1px solid var(--line);
  background:transparent;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;
  font-size:11px;font-weight:500;color:var(--slate);transition:.14s;
}
.logout-btn:hover{background:var(--red-light);color:var(--red);border-color:var(--red);}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen" style="position:fixed;inset:0;background:#F7F8FA;z-index:999;display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:36px 40px;width:380px;max-width:95vw;box-shadow:0 4px 24px rgba(0,0,0,.10);border-top:3px solid #C8102E;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px;">
      <img id="login-logo" alt="Hilgenroth" style="height:36px;">
      <div>
        <div style="font-size:15px;font-weight:600;color:#1B1D22;">Firmen-Cockpit</div>
        <div style="font-size:12px;color:#8A909B;">Rudolf Hilgenroth GmbH &amp; Co. KG</div>
      </div>
    </div>
    <div style="margin-bottom:14px;">
      <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#4A4F58;display:block;margin-bottom:5px;">Name auswählen</label>
      <select id="login-user" style="width:100%;height:38px;padding:0 12px;border:1px solid #E6E8EC;border-radius:7px;font-family:inherit;font-size:13px;color:#1B1D22;background:#fff;">
        <option value="">— bitte wählen —</option>
      </select>
    </div>
    <div style="margin-bottom:14px;">
      <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#4A4F58;display:block;margin-bottom:5px;">Passwort</label>
      <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"
        style="width:100%;height:38px;padding:0 12px;border:1px solid #E6E8EC;border-radius:7px;font-family:inherit;font-size:13px;color:#1B1D22;background:#fff;">
    </div>
    <button onclick="doLogin()" style="width:100%;height:40px;background:#C8102E;color:#fff;border:none;border-radius:7px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;">Anmelden</button>
    <div id="login-err" style="font-size:12px;color:#C8102E;margin-top:8px;min-height:18px;text-align:center;"></div>
  </div>
</div>

<!-- Admin Modal -->
<div id="admin-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:none;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:10px;width:680px;max-width:96vw;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15);">
    <div style="padding:18px 22px;border-bottom:1px solid #E6E8EC;display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:15px;font-weight:600;">⚙ Nutzerverwaltung</span>
      <button onclick="document.getElementById('admin-modal').style.display='none'" style="height:26px;padding:0 12px;border-radius:5px;border:1px solid #E6E8EC;background:transparent;cursor:pointer;font-family:inherit;font-size:11px;">Schließen</button>
    </div>
    <div style="padding:20px 22px;">
      <div id="user-list"></div>
      <div style="background:#F7F8FA;border-radius:8px;padding:16px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;">
        <div><label style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#4A4F58;display:block;margin-bottom:4px;">Name</label>
          <input id="new-username" placeholder="z.B. Busemann" style="width:100%;height:34px;padding:0 10px;border:1px solid #E6E8EC;border-radius:6px;font-family:inherit;font-size:13px;"></div>
        <div><label style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#4A4F58;display:block;margin-bottom:4px;">Passwort</label>
          <input id="new-userpass" placeholder="z.B. sicher123" type="text" style="width:100%;height:34px;padding:0 10px;border:1px solid #E6E8EC;border-radius:6px;font-family:inherit;font-size:13px;"></div>
        <button onclick="addUser()" style="height:34px;padding:0 16px;background:#C8102E;color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;">+ Hinzufügen</button>
      </div>
    </div>
  </div>
</div>

const SUB = {
  'labor-beton':   {label:'Betonpruefungen',          icon:'beton',   file:'beton.html'},
  'labor-asphalt': {label:'Analyse Asphaltmischgut',  icon:'asphalt', file:'asphalt.html'},
  'labor-bericht': {label:'Laborbericht-Pruefanalyse',icon:'bericht', file:'laborbericht.html'},
};

const loaded = new Set();
let currentSub = 'labor-beton';

function buildFrames(){
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  // Nur erlaubte Tool-IDs als iframes anlegen
  const perms = currentUser ? (currentUser.perms||[]) : null;
  const subIds = Object.keys(SUB);
  const all = [];
  for(const tools of Object.values(TOOLS)) for(const t of tools) if(!t.sub) all.push(t);
  for(const [id,s] of Object.entries(SUB)) all.push({id, label:s.label, file:s.file});
  for(const t of all){
    // Nicht erlaubte Tools überspringen (Sub-Tools immer bauen)
    if(perms && !subIds.includes(t.id) && !perms.includes(t.id)) continue;
    const loader=document.createElement('div');
    loader.className='loader';loader.id='loader-'+t.id;
    loader.innerHTML=`<div class="spinner"></div><div class="loader-text">${t.label} wird geladen</div>`;
    stage.appendChild(loader);

    const err=document.createElement('div');
    err.className='errbox';err.id='err-'+t.id;
    err.innerHTML=`<div class="ic">${IC.warn}</div><h3>Seite nicht gefunden</h3>
      <p>Die Datei <code>${t.file}</code> liegt nicht im selben Ordner wie diese Seite. Lade alle Tool-Dateien in dasselbe Verzeichnis.</p>`;
    stage.appendChild(err);

    const fr=document.createElement('iframe');
    fr.className='frame';fr.id='frame-'+t.id;fr.dataset.file=t.file||'';
    fr.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation-by-user-activation allow-downloads');
    fr.addEventListener('load',()=>{
      document.getElementById('loader-'+t.id)?.classList.remove('visible');
    });
    stage.appendChild(fr);
  }
}

function hideAll(){
  document.querySelectorAll('.frame').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.loader,.errbox').forEach(e=>e.classList.remove('visible'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
}

function loadShow(id,file){
  const fr=document.getElementById('frame-'+id);if(!fr)return;
  if(!loaded.has(id)){loaded.add(id);document.getElementById('loader-'+id)?.classList.add('visible');fr.src=fr.dataset.file||file||'';}
  fr.classList.add('active');
}

function activate(toolId){
  hideAll();
  document.querySelector(`.tab[data-tool="${toolId}"]`)?.classList.add('active');
  const t=Object.values(TOOLS).flat().find(x=>x.id===toolId);
  if(!t)return;
  const subbar=document.getElementById('subbar');
  if(t.sub){subbar.classList.add('visible');activateSub(currentSub);return;}
  subbar.classList.remove('visible');
  loadShow(toolId,t.file);
}

function activateSub(subId){
  currentSub=subId;
  document.querySelectorAll('.frame').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.loader,.errbox').forEach(e=>e.classList.remove('visible'));
  document.querySelectorAll('.subtab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.subtab[data-sub="${subId}"]`)?.classList.add('active');
  loadShow(subId,SUB[subId].file);
}

function renderSubbar(){
  const bar=document.getElementById('subbar');
  bar.innerHTML='';

  }

function renderTabs(company){

  TOOLS[company].forEach((t,i)=>{

    btn.className='tab'+(t.sub?' has-sub':'');

    btn.innerHTML=`${IC[t.icon]||''}<span>${t.label}</span>${t.sub?IC.chev:''}<span class="tab-underline"></span>`;

function switchCompany(company,btn){
  document.querySelectorAll('.company-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const logo=document.getElementById('brand-logo');
  logo.classList.add('fade');
  setTimeout(()=>{logo.src=LOGOS[company];logo.classList.remove('fade');},180);
  document.getElementById('subbar').classList.remove('visible');
  // Gefilterte Tabs rendern
  if(currentUser){
    const perms=currentUser.perms||[];
    const ft={
      sundern: TOOLS.sundern.filter(t=>t.sub||perms.includes(t.id)),
      hellefeld: TOOLS.hellefeld.filter(t=>t.sub||perms.includes(t.id)),
    };
    renderTabsFiltered(company, ft);
    hideAll();
    const first=ft[company]?.[0];
    if(first) activate(first.id);
  } else {
    renderTabs(company);
    hideAll();
    const first=TOOLS[company][0];
    if(first) activate(first.id);
  }
}

// Nutzer-Liste für Login befüllen
function buildLoginList(){
  const sel = document.getElementById('login-user');
  const fbNames = Object.values(allUsers).filter(u=>u&&u.name).map(u=>u.name);
  const fixedNames = FIXED_USERS.map(u=>u.name);

// Session prüfen
function checkSession(){
  // Nur Felder vorausfüllen — KEIN Auto-Login
  const saved = localStorage.getItem('cockpit_user');
  if(!saved) return false;
  try {
    const u = JSON.parse(saved);
    // Name im Dropdown vorwählen
    const sel = document.getElementById('login-user');
    if(sel && u.name){

  } catch(e){}

function doLogin(){
  const name = document.getElementById('login-user').value;
  const pass = document.getElementById('login-pass').value.trim();
  const err  = document.getElementById('login-err');
  err.textContent = '';

  // Master-Admin
  if(pass === ADMIN_PASS){
    currentUser = {name: name||'Admin', perms: ALL_PERMS.map(p=>p.id), isAdmin:true};
    localStorage.setItem('cockpit_user', JSON.stringify({name:currentUser.name, pass, isAdmin:true}));
    startCockpit(); return;
  }

  // Feste Nutzer (Pascal etc.) — funktionieren ohne Firebase
  const fixed = FIXED_USERS.find(u=>u.name===name && u.pass===pass);
  if(fixed){
    currentUser = {
      name: fixed.name,
      perms: fixed.perms==='ALL' ? ALL_PERMS.map(p=>p.id) : (fixed.perms||[]),
      isAdmin: !!fixed.isAdmin
    };
    localStorage.setItem('cockpit_user', JSON.stringify({name:fixed.name, pass, isAdmin:fixed.isAdmin, fixed:true}));
    startCockpit(); return;
  }

  if(!name){ err.textContent='Bitte Namen wählen.'; return; }

  // Firebase-Nutzer
  const u = Object.values(allUsers).find(x=>x&&x.name===name&&x.pass===pass);
  if(!u){ err.textContent='Falsches Passwort.'; return; }
  applyUser(u);
}

function applyUser(u){
  currentUser = {name:u.name, perms: u.perms||[], isAdmin:!!u.isAdmin};
  localStorage.setItem('cockpit_user', JSON.stringify({name:u.name, pass:u.pass, isAdmin:u.isAdmin}));
  startCockpit();
}

function doLogout(){
  localStorage.removeItem('cockpit_user');

  document.getElementById('login-screen').style.display='flex';

  document.getElementById('logout-btn').style.display='none';

  document.getElementById('login-pass').value='';

}

function startCockpit(){
  document.getElementById('login-screen').style.display='none';
  // Frames erst jetzt bauen — nach Login, mit bekannten Berechtigungen
  buildFrames();
  renderSubbar();
  const ui=document.getElementById('cockpit-ui');
  const cb=document.getElementById('company-bar-el');
  const st=document.getElementById('stage');
  if(ui) ui.style.display='';
  if(cb) cb.style.display='';
  if(st) st.style.display='';
  const lbtn2=document.getElementById('logout-btn');
  const abtn2=document.getElementById('admin-btn');
  if(lbtn2) lbtn2.style.display='inline-flex';
  if(abtn2) abtn2.style.display=currentUser.isAdmin?'inline-flex':'none';
  const nameEl=document.getElementById('current-user-name');
  if(nameEl){nameEl.textContent=currentUser.name||'';nameEl.style.display='';}

  // TOOLS nach Berechtigungen filtern
  const perms = currentUser.perms;
  const filteredTools = {
    sundern: TOOLS.sundern.filter(t=> t.sub || perms.includes(t.id)),
    hellefeld: TOOLS.hellefeld.filter(t=> t.sub || perms.includes(t.id)),
  };
  // Labor nur zeigen wenn mind. ein Sub erlaubt
  // (Labor selbst hat kein file, daher immer erlaubt wenn Labor-Reiter gewünscht)

  // Welche Companies hat der Nutzer?
  const hasSundern = filteredTools.sundern.length > 0;
  const hasHelle   = filteredTools.hellefeld.length > 0;

  // Company-Buttons ein-/ausblenden
  const cbs = document.querySelector('.company-btn[onclick*="sundern"]');
  const cbh = document.querySelector('.company-btn[onclick*="hellefeld"]');
  if(cbs) cbs.style.display = hasSundern ? '' : 'none';
  if(cbh) cbh.style.display = hasHelle   ? '' : 'none';

  // Beide Buttons auf inaktiv setzen
  document.querySelectorAll('.company-btn').forEach(b=>b.classList.remove('active'));

  if(hasSundern){
    // Sundern aktiv
    if(cbs) cbs.classList.add('active');
    const dlbl=document.getElementById('div-label');
    if(dlbl) dlbl.textContent='Straßen-, Tief- und Kanalbau';
    renderTabsFiltered('sundern', filteredTools);
    const first = filteredTools.sundern[0];
    if(first) activate(first.id);
  } else if(hasHelle){
    // Hellefeld aktiv
    if(cbh) cbh.classList.add('active');
    const dlbl=document.getElementById('div-label');
    if(dlbl) dlbl.textContent='Straßenbaustoffe & Transportbeton';
    renderTabsFiltered('hellefeld', filteredTools);
    const first = filteredTools.hellefeld[0];
    if(first) activate(first.id);
  }
}

function renderTabsFiltered(company, filteredTools){
  const tools = filteredTools ? filteredTools[company] : TOOLS[company];
  const bar = document.getElementById('tabbar');
  bar.innerHTML='';
  tools.forEach((t,i)=>{
    const btn=document.createElement('button');
    btn.className='tab'+(t.sub?' has-sub':'');
    btn.dataset.tool=t.id;btn.style.animationDelay=(i*40)+'ms';
    btn.innerHTML=`${IC[t.icon]||''}<span>${t.label}</span>${t.sub?IC.chev:''}<span class="tab-underline"></span>`;
    btn.addEventListener('click',()=>activate(t.id));
    bar.appendChild(btn);
  });
}

  if(!currentUser){ _origRenderTabs(company); return; }
  const perms = currentUser.perms;

    hellefeld: TOOLS.hellefeld.filter(t=>t.sub||perms.includes(t.id)),

}

function openAdmin(){
  document.getElementById('admin-modal').style.display='flex';

}

function renderUserList(){
  const list = document.getElementById('user-list');
  const users = Object.entries(allUsers).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
  if(!users.length){ list.innerHTML='<p style="color:#8A909B;font-size:13px">Noch keine Nutzer. Unten hinzufügen.</p>'; return; }
  list.innerHTML = users.map(([k,u])=>{
    if(!u||!u.name) return '';
    const perms = u.perms||[];
    const pills = ALL_PERMS.map(p=>`
      <span class="perm-pill${perms.includes(p.id)?' on':''}" onclick="togglePerm('${k}','${p.id}',this)">
        ${p.label}
      </span>`).join('');
    return `<div class="user-row">
      <div>
        <div class="user-name">${u.name}</div>
        <div class="user-pass">PW: ${u.pass||''}</div>
      </div>
      <div class="perm-grid">${pills}</div>
      <button class="user-del" onclick="delUser('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>`;
  }).join('');
}

function togglePerm(userKey, permId, pill){
  const u = allUsers[userKey];
  if(!u) return;
  let perms = u.perms||[];
  if(perms.includes(permId)) perms=perms.filter(p=>p!==permId);
  else perms=[...perms, permId];
  if(UR) UR.child(userKey).update({perms});
  allUsers[userKey].perms = perms;
  pill.classList.toggle('on');
}

function addUser(){
  const name = document.getElementById('new-username').value.trim();
  const pass = document.getElementById('new-userpass').value.trim();
  if(!name||!pass){ alert('Name und Passwort sind Pflicht.'); return; }
  const k = UR.push().key;
  const u = {name, pass, perms:[]};
  if(UR) UR.child(k).set(u);
  allUsers[k]=u;
  document.getElementById('new-username').value='';
  document.getElementById('new-userpass').value='';
  renderUserList();
  buildLoginList();
}

function delUser(k){
  if(!confirm(`Nutzer "${allUsers[k]?.name}" löschen?`))return;
  if(UR) UR.child(k).remove();
  delete allUsers[k];
  renderUserList();
  buildLoginList();
}

document.getElementById('admin-modal').addEventListener('click',e=>{
  if(e.target===e.currentTarget) e.currentTarget.style.display='none';
});
