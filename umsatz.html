        var mi=monatIdx(parsed),yr=jahrVal(parsed);
        var typ=parsed.wg==='A'?'asphalt':parsed.wg==='B'?'beton':'asphalt';
        if(!D.monate)D.monate={};
        if(!D.monate[typ])D.monate[typ]={};
        if(!D.monate[typ][yr])D.monate[typ][yr]={};
        D.monate[typ][yr][mi]=parsed;
        var st=document.getElementById('mo-status');
        if(st){
          var list=[];
          Object.keys(D.monate).forEach(function(t){Object.keys(D.monate[t]).forEach(function(y){Object.keys(D.monate[t][y]).forEach(function(m){list.push(MN[parseInt(m)]+' '+y);});});});
          st.textContent='✓ Geladen: '+list.join(', ');
        }
        document.getElementById('sd').textContent=new Date().toLocaleDateString('de-DE');
        rn();
      }catch(err){console.warn(err);}
    };
    reader.readAsText(file,'utf-8');
  });
}
bp();rn();
function availableMonths(){
  // Alle Monate sammeln die echte Daten haben (aus D.monate oder Jahresdaten)
  var set={};
  if(D.monate){
    ['asphalt','beton'].forEach(function(typ){
      if(!D.monate[typ])return;
      Object.keys(D.monate[typ]).forEach(function(yr){
        Object.keys(D.monate[typ][yr]).forEach(function(mi){
          set[parseInt(mi)]=1;
        });
      });
    });
  }
  // Immer alle Monate 0-11 anzeigen die in irgendeinem Jahr Daten haben
  var months=Object.keys(set).map(Number).sort(function(a,b){return a-b;});
  // Mindestens Jan-Dez (0-11) anzeigen
  for(var i=0;i<=11;i++)set[i]=1;
  months=Object.keys(set).map(Number).sort(function(a,b){return a-b;});
  return months;
}

function bp(){
  var mp=document.getElementById('mp');
  if(!mp)return;
  var months=availableMonths();
  var btns=[{lbl:'Gesamt',m:null}].concat(months.map(function(mi){return{lbl:MN[mi],m:mi};}));
  var existing=mp.querySelectorAll('button');
  // Neu bauen wenn Anzahl sich geändert hat
  if(existing.length!==btns.length){
    mp.innerHTML='';
    btns.forEach(function(b,i){
      var btn=document.createElement('button');
      btn.className='pi';
      btn.textContent=b.lbl;
      btn.addEventListener('click',function(){
        selMonth=b.m;
        bp();rn();
      });
      mp.appendChild(btn);
    });
  }
  // Klassen aktualisieren
  mp.querySelectorAll('button').forEach(function(btn,i){
    var m=btns[i].m;
    var on=(m===null&&selMonth===null)||(m!==null&&selMonth===m);
    btn.className='pi'+(on?' on':'');
  });
}
function getMo(typ,yr,mi){
  if(!D.monate||!D.monate[typ])return null;
  // Keys können String oder Number sein (JSON-Serialisierung)
  var yObj=D.monate[typ][yr]||D.monate[typ][String(yr)];
  if(!yObj)return null;
  return yObj[mi]||yObj[String(mi)]||null;
}
function hasMo(typ,yr,mi){return !!getMo(typ,yr,mi);}
function gg(typ,yr){
  if(selMonth!==null){
    var mo=getMo(typ,yr,selMonth);
    if(mo)return Object.assign({},mo.gruppe||{});
    // Keine Monatsdaten: aus Jahressumme schätzen mit Hinweis
    var d=D[typ+'_'+yr];if(!d)return{};
    var tot=yr===2026?7:12;
    return Object.assign({},d.gruppe||{},{menge:(d.gruppe.menge||0)/tot,umsatz:(d.gruppe.umsatz||0)/tot,isEstimate:true});
  }
  var d=D[typ+'_'+yr];if(!d)return{};
  return Object.assign({},d.gruppe||{});
}
function ga(typ,yr){
  if(selMonth!==null){
    var mo=getMo(typ,yr,selMonth);
    if(mo)return mo.artikel||[];
    // Keine Monatsdaten: aus Jahressumme schätzen
    var d=D[typ+'_'+yr];if(!d)return[];
    var tot=yr===2026?7:12;
    return(d.artikel||[]).map(function(a){return Object.assign({},a,{menge:(a.menge||0)/tot,umsatz:(a.umsatz||0)/tot,isEstimate:true});});
  }
  var d=D[typ+'_'+yr];if(!d)return[];
  return d.artikel||[];
}
function pl(yr){
  if(selMonth!==null){
    var mo=getMo('asphalt',yr,selMonth)||getMo('beton',yr,selMonth);
    if(mo)return mo.von+' \u2013 '+mo.bis;
    return MN[selMonth]+' '+(yr||2026)+' (\u00d8-Sch\u00e4tzung)';
  }
  var d=D[(yr===2025?'asphalt_2025':'asphalt_2026')];
  return d?d.von+' \u2013 '+d.bis:String(yr||2026);
}

function rn(){
  var c=document.getElementById('ct');
  if(tab==='u'){c.innerHTML=ru();}
  else if(tab==='a'){ra('asphalt','#DC2626','ta','t');}
  else if(tab==='b'){ra('beton','#2563EB','tb','cbm');}
  else{ru2();}
}

function ru(){
  var a=gg('asphalt',2026),b=gg('beton',2026);
  var ca=gg('asphalt',2025),cb=gg('beton',2025);
  var tot=(a.umsatz||0)+(b.umsatz||0),ctot=(ca.umsatz||0)+(cb.umsatz||0);
  var h='';
  // Gesamtumsatz-Reihe
  h+='<div class="g2">';
  h+='<div class="kp"><div class="kl">Gesamtumsatz 2026</div><div class="kv">'+f2(tot)+'<span class="ku">\u20ac</span></div><div class="ks">'+pl(2026)+'</div>'+de(tot,ctot)+'</div>';
  if(cmp)h+='<div class="kp pv"><div class="kl">Gesamtumsatz <span class="vt">VJ 2025</span></div><div class="kv">'+f2(ctot)+'<span class="ku">\u20ac</span></div><div class="ks">'+pl(2025)+'</div></div>';
  h+='</div>';
  // Asphalt-Karte
  h+='<div class="cc"><div class="ch"><div class="cd" style="background:#DC2626"></div><span class="ct2">Asphalt</span></div><div class="cg">';
  h+='<div class="ce"><div class="cel">Umsatz 2026</div><div class="cev">'+eu(a.umsatz)+'</div><div style="font-size:11px;color:var(--muted);margin-top:3px">'+pl(2026)+'</div>'+de(a.umsatz,ca.umsatz)+'</div>';
  h+='<div class="ce"><div class="cel">Menge 2026</div><div class="cev">'+mg(a.menge,'t')+'</div><div style="font-size:11px;color:var(--muted);margin-top:3px">'+pl(2026)+'</div>'+de(a.menge,ca.menge)+'</div>';
  if(cmp){
    h+='<div class="ce pv"><div class="cel">Umsatz <span class="vt">VJ 2025</span></div><div class="cev">'+eu(ca.umsatz)+'</div><div style="font-size:11px;color:var(--prev);margin-top:3px">'+pl(2025)+'</div></div>';
    h+='<div class="ce pv"><div class="cel">Menge <span class="vt">VJ 2025</span></div><div class="cev">'+mg(ca.menge,'t')+'</div><div style="font-size:11px;color:var(--prev);margin-top:3px">'+pl(2025)+'</div></div>';
  }
  h+='</div></div>';
  // Beton-Karte
  h+='<div class="cc"><div class="ch"><div class="cd" style="background:#2563EB"></div><span class="ct2">Beton</span></div><div class="cg">';
  h+='<div class="ce"><div class="cel">Umsatz 2026</div><div class="cev">'+eu(b.umsatz)+'</div><div style="font-size:11px;color:var(--muted);margin-top:3px">'+pl(2026)+'</div>'+de(b.umsatz,cb.umsatz)+'</div>';
  h+='<div class="ce"><div class="cel">Menge 2026</div><div class="cev">'+mg(b.menge,'cbm')+'</div><div style="font-size:11px;color:var(--muted);margin-top:3px">'+pl(2026)+'</div>'+de(b.menge,cb.menge)+'</div>';
  if(cmp){
    h+='<div class="ce pv"><div class="cel">Umsatz <span class="vt">VJ 2025</span></div><div class="cev">'+eu(cb.umsatz)+'</div><div style="font-size:11px;color:var(--prev);margin-top:3px">'+pl(2025)+'</div></div>';
    h+='<div class="ce pv"><div class="cel">Menge <span class="vt">VJ 2025</span></div><div class="cev">'+mg(cb.menge,'cbm')+'</div><div style="font-size:11px;color:var(--prev);margin-top:3px">'+pl(2025)+'</div></div>';
  }
  h+='</div></div>';
  return h;
}

var _at='asphalt',_ah='#DC2626',_ag='ta',_ae='t';
function ra(typ,hex,tag,ein){
  _at=typ;_ah=hex;_ag=tag;_ae=ein;
  var items=ga(typ,2026),ci=ga(typ,2025),cm={};
  ci.forEach(function(a){cm[a.name]=a;});
  var seen={};
  var merged=items.map(function(a){seen[a.name]=1;var c=cm[a.name]||{};return Object.assign({},a,{cm:c.menge||0,cu:c.umsatz||0});});
  ci.filter(function(a){return!seen[a.name];}).forEach(function(a){merged.push(Object.assign({},a,{menge:0,umsatz:0,cm:a.menge||0,cu:a.umsatz||0}));});
  var sq=(document.getElementById('sq-art')||{value:''}).value.toLowerCase();
  if(sq)merged=merged.filter(function(i){return i.name.toLowerCase().indexOf(sq)>=0||(i.artnr||'').toLowerCase().indexOf(sq)>=0;});
  merged.sort(function(a,b){return sd*((b[sk]||0)-(a[sk]||0));});
  var maxM=Math.max.apply(null,merged.map(function(i){return i.menge||0;}).concat([1]));
  var lbl=typ==='asphalt'?'Asphalt':'Beton';
  var h='<div class="tw"><div class="th2">';
  h+='<div style="display:flex;align-items:center;gap:10px">';
  h+='<span class="'+tag+'">'+lbl.toUpperCase()+'</span>';
  h+='<span style="font-size:13px;font-weight:600">Alle Sorten</span>';
  h+='<span style="font-size:10px;color:var(--muted)">'+pl(2026)+'</span>';
  h+='<span style="font-size:10px;background:#F3F4F6;padding:2px 8px;border-radius:4px;color:var(--muted)">'+merged.length+' Sorten</span></div>';
  h+='<div class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>';
  h+='<input class="si" id="sq-art" placeholder="Sorte suchen \u2026"></div></div>';
  function th(k,l,p){var a=sk===k;return '<th class="nr'+(p?' pth':'')+'" data-sk="'+k+'" style="cursor:pointer">'+l+(a?(sd>0?' \u2191':' \u2193'):'')+'</th>';}
  h+='<div style="overflow-x:auto"><table id="at"><thead><tr><th>Sorte</th><th>Art.-Nr.</th>';
  h+=th('menge','Menge 2026',false)+th('umsatz','Umsatz 2026',false);
  if(cmp)h+=th('cm','Menge <span class="vt">VJ 2025</span>',true)+th('cu','Umsatz <span class="vt">VJ 2025</span>',true)+'<th class="nr">\u0394 Umsatz</th><th class="nr">\u0394 Menge</th>';
  h+='</tr></thead><tbody>';
  merged.forEach(function(i){
    var bw=Math.round((i.menge||0)/maxM*100);
    h+='<tr><td style="font-weight:500;max-width:260px">'+es(i.name)+'<div class="bb"><div class="bf" style="background:'+hex+';width:'+bw+'%"></div></div></td>';
    h+='<td style="font-size:11px;color:var(--dim);font-family:var(--mono)">'+es(i.artnr||'\u2013')+'</td>';
    h+='<td class="nr">'+(i.menge?f0(i.menge)+' '+ein:'\u2013')+'</td>';
    h+='<td class="nr">'+(i.umsatz?f2(i.umsatz)+' \u20ac':'\u2013')+'</td>';
    if(cmp){
      h+='<td class="nr" style="color:var(--prev)">'+(i.cm?f0(i.cm)+' '+ein:'\u2013')+'</td>';
      h+='<td class="nr" style="color:var(--prev)">'+(i.cu?f2(i.cu)+' \u20ac':'\u2013')+'</td>';
      h+=dt(i.umsatz||0,i.cu||0)+dt(i.menge||0,i.cm||0);
    }
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById('ct').innerHTML=h;
  var si=document.getElementById('sq-art');
  if(si)si.addEventListener('input',function(){ra(_at,_ah,_ag,_ae);});
  (document.getElementById('at')||{querySelectorAll:function(){return[];}}).querySelectorAll('th[data-sk]').forEach(function(el){
    el.addEventListener('click',function(){var k=this.dataset.sk;if(sk===k)sd*=-1;else{sk=k;sd=-1;}ra(_at,_ah,_ag,_ae);});
  });
}

function ru2(){
  var c=document.getElementById('ct');
  var keys=['asphalt_2026','asphalt_2025','beton_2026','beton_2025'];
  var lbls=['Asphalt 2026','Asphalt 2025 (Vorjahr)','Beton 2026','Beton 2025 (Vorjahr)'];
  // Monatsübersicht
  var moList='';
  if(D.monate){
    Object.keys(D.monate).forEach(function(t){
      Object.keys(D.monate[t]).forEach(function(yr){
        Object.keys(D.monate[t][yr]).forEach(function(mi){
          var d=D.monate[t][yr][mi];
          moList+='<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px">'+
            '<span style="font-weight:600;min-width:80px">'+MN[parseInt(mi)]+' '+yr+'</span>'+
            '<span class="'+(t==='asphalt'?'ta':'tb')+'">'+t.toUpperCase()+'</span>'+
            '<span style="font-family:var(--mono);color:var(--muted)">'+d.von+' – '+d.bis+'</span>'+
            '<span style="font-family:var(--mono);margin-left:auto">'+
              (d.gruppe&&d.gruppe.umsatz?d.gruppe.umsatz.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €':'')+'</span>'+
          '</div>';
        });
      });
    });
  }
  c.innerHTML=
    '<div style="font-size:13px;font-weight:600;margin-bottom:14px">Jahresdaten importieren</div>'+
    '<div class="ug" id="ug"></div>'+
    '<div style="height:1px;background:var(--border);margin:20px 0"></div>'+
    '<div style="font-size:13px;font-weight:600;margin-bottom:8px">Monatsdaten importieren</div>'+
    '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">BRZ-Export eines einzelnen Monats (z.B. 01.04.2026 – 30.04.2026). Typ wird automatisch erkannt.</div>'+
    '<label class="ub" style="max-width:300px;display:inline-flex;cursor:pointer">'+
      '↑ CSV hochladen'+
      '<input type="file" accept=".csv,.txt" style="display:none" id="mo-file-inp">'+
    '</label>'+
    (moList?'<div style="margin-top:14px;max-width:640px">'+
      '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px">Geladene Monate</div>'+
      moList+'</div>':'')+'';
  var grid=document.getElementById('ug');
  keys.forEach(function(key,i){
    var d=D[key],ok=d&&d.gruppe&&d.gruppe.umsatz>0;
    var div=document.createElement('div');div.className='uc';
    div.innerHTML='<div style="font-size:12px;font-weight:600;margin-bottom:5px">'+lbls[i]+'</div>'+
      '<div style="font-size:11px;font-family:var(--mono);color:'+(ok?'var(--green)':'var(--muted)')+'">'+
      (ok?'\u2713 '+d.von+' \u2013 '+d.bis+'<br>'+f2(d.gruppe.umsatz)+' \u20ac':'Noch keine Daten')+'</div>'+
      '<label class="ub">\u2191 CSV hochladen<input type="file" accept=".csv,.txt" style="display:none"></label>';
    div.querySelector('input').addEventListener('change',function(){imp(this,key);});
    grid.appendChild(div);
  });
}

function imp(inp,key){
  var file=inp.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var lines=e.target.result.split(/[\r\n]+/);
      var dv='',db='';
      for(var i=0;i<20;i++){var l=lines[i]||'';if(l.indexOf('von LFSDatum')>=0){var p=l.split('	').map(function(s){return s.replace(/"/g,'').trim();});dv=p[1]||'';db=p[3]||'';}}
      var hdr=-1;for(var i=0;i<lines.length;i++){if(lines[i].indexOf('Artikelgruppe')>=0){hdr=i;break;}}
      if(hdr<0){alert('Kein g\u00fcltiges BRZ-Format.');return;}
      var items=[],cg='',ce='t';
      function pn(s){s=String(s||'').replace(/[.]/g,'').replace(',','.');var n=parseFloat(s);return isNaN(n)?0:n;}
      for(var i=hdr+1;i<lines.length;i++){
        var l=lines[i];if(!l.trim())continue;
        var p=l.split('	').map(function(s){return s.replace(/"/g,'').trim();});
        if(p.length<4)continue;
        var c0=p[0];
        if(/^[A-Z] /.test(c0)){cg=c0;var em=c0.match(/[(]([A-Za-z]+)[)]/);ce=em?em[1]:'t';items.push({typ:'gruppe',name:c0,menge:pn(p[1]),umsatz:pn(p[3]),einheit:ce,eur_einheit:pn(p[4]||'0')});}
        else if(c0&&p.length>=6){var nm=p[1];var m=pn(p[2]);if(nm&&m>0)items.push({typ:'artikel',artnr:c0,name:nm,menge:m,einheit:p[3]||ce,umsatz:pn(p[4]),eur_einheit:pn(p[5]),gruppe:cg});}
      }
      D[key]={von:dv,bis:db,gruppe:items.filter(function(i){return i.typ==='gruppe';})[0]||{},artikel:items.filter(function(i){return i.typ==='artikel';})};
      document.getElementById('sd').textContent=new Date().toLocaleDateString('de-DE');
      alert('\u2713 '+items.filter(function(i){return i.typ==='artikel';}).length+' Artikel importiert');
      rn();
    }catch(err){alert('Fehler: '+err.message);}
  };
  reader.readAsText(file,'utf-8');
}

document.addEventListener("DOMContentLoaded",function(){bp();rn();});
</script>
